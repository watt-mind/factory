# Per-node Arena runner & cross-judge roster (GH-2426).
# Copy to ~/.factory/arena.yaml on each node and customize for the CLI
# harnesses and subscription windows available on that host.

defaults:
  profile: default
  mode: sandbox # sandbox | worktree
  min_runners: 2
  timeout_seconds: 600

runners:
  gpt-sol:
    harness: codex
    model: gpt-6.2-sol
    vendor: openai
    effort: high
    fallback:
      harness: pi
      model: openai-codex/gpt-6.1-sol

  fable:
    harness: claude
    model: claude-fable-5-2
    vendor: anthropic
    effort: high

  opus:
    harness: claude
    model: claude-opus-5-5
    vendor: anthropic
    effort: high

  carbon:
    harness: agy
    model: gemini-4-carbon-high
    vendor: google
    effort: high

  argon:
    harness: agy
    model: gemini-4-argon-high
    vendor: google
    effort: high

profiles:
  # Default: 3 runners spanning OpenAI, Anthropic, and Google.
  default:
    - gpt-sol
    - fable
    - carbon

  # Full: all 5 contenders across Codex, Claude, and Antigravity.
  full:
    - gpt-sol
    - fable
    - opus
    - carbon
    - argon

# Ordered read-only cross-judge pool. Arena picks the first entry whose
# vendor differs from the calling harness (fable counts as anthropic).
cross_judge_pool:
  - opus
  - carbon
  - gpt-sol
