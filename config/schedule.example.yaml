# Tracked example only. Run `factory init`, then edit config/schedule.yaml.
# No recurring automation is enabled by default in a new installation.

defaults:
  repo: factory
  harness: claude
  label_prefix: com.example.factory
  log_dir: ~/.factory/logs
  run_at_load: false

# Add reviewed jobs here. Keeping the example empty ensures cloning Factory can
# never start unattended mutation merely because a scheduler was installed.
jobs: []

# Runtime schedule overlay (optional). `event-runtime/schedules.json` defines
# tracked kernel defaults; these ignored, instance-specific values are merged
# at runtime and do not change the registry digest. Existing loop names may
# override enabled, every, and payload fields. They can request `approval: auto`
# only when this top-level, explicit operator allowlist names the same loop;
# otherwise the request is forced to watched. An authorized loop is visible as
# source: operator-authorized-auto in `factory schedules` / GET /schedules.
# A new name must provide a complete schedule entry (including eventType) and
# remains watched even if it appears in the allowlist.
#
# Replace client-repo with a real local repo name. These commented examples
# mirror the current instance migration without publishing a client name:
# This acknowledgement must name every existing loop that requests auto.
# overlay_auto_approve:
#   - merge-client-repo
# schedules:
#   merge-factory:
#     enabled: true
#     every: 4h
#   work-client-repo:
#     enabled: true
#   merge-client-repo:
#     enabled: true
#     approval: auto
#
# The kernel's tracked schedules.json ships only the four public loops
# (reaper, work-factory, merge-factory, triage-factory). Every per-client
# repo loop lives here in the instance overlay so no client identity leaks
# into the public repository. A brand-new overlay name must carry a complete
# entry (eventType, cadence, payload) and stays `watched` until it is also
# listed in overlay_auto_approve above. Replace `client-repo` with your real
# local repo name and repeat the block per repo you run. The full loop set a
# product repo typically schedules:
#
# schedules:
#   work-client-repo:
#     enabled: true
#     every: 30m
#     eventType: factory.work.requested
#     payload: { repo: client-repo }
#   merge-client-repo:
#     enabled: true
#     every: 30m
#     eventType: factory.merge.requested
#     payload: { repo: client-repo }
#   ship-client-repo:
#     enabled: true
#     every: 7d
#     eventType: factory.ship.requested
#     payload: { repo: client-repo }
#   reconcile-client-repo:
#     enabled: true
#     every: 10m
#     eventType: factory.reconcile.requested
#     payload: { repo: client-repo }
#   label-guard-client-repo:
#     enabled: true
#     every: 5m
#     eventType: factory.label-guard.requested
#     payload: { repo: client-repo }
#   warm-client-repo:
#     enabled: true
#     every: 2h
#     eventType: factory.warm.requested
#     payload: { repo: client-repo }
#   unblock-digest-client-repo:
#     enabled: true
#     every: 1d
#     eventType: factory.unblock-digest.requested
#     payload: { repo: client-repo }
