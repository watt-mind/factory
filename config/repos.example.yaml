# Tracked example only. Run `factory init`, then edit config/repos.yaml.
# Keep machine-specific paths and private/client repository names out of git.
repos:
  # Factory can manage its own checkout. The home-relative paths are portable;
  # change them in config/repos.yaml if your checkout layout differs.
  - name: factory
    path: ~/Develop/factory
    github: watt-mind/factory
    icon: ph-robot
    color: orange
    team: WM
    project: Factory
    # Which tracker holds this repo's tickets: linear | github | memory.
    # Omit to inherit config/policy.yaml's controlPlane.kind (itself defaulting
    # to linear). Setting it per repo is what lets one factory instance run
    # this repo on GitHub Issues while every other repo it manages stays on
    # Linear — without it the choice is global and moving one moves all.
    # control_plane: github
    base: develop
    deploy_branch: main
    worktree_up: bin/worktree-up.sh
    worktree_down: bin/worktree-down.sh
    worktree_root: ~/Develop/.worktrees/factory
    max_in_flight: 20
    verify: bun test event-runtime/lib --timeout 20000 && bun build/emit.mjs --check
    # Toolchain preflight (WM-316). Each entry is an { executable, constraint }
    # pair; constraint is a semver range. Before a ticket is claimed, dispatch
    # resolves each executable on the target node and checks its version. A
    # missing executable fails with repo_toolchain_missing; a version outside
    # the range fails with repo_toolchain_mismatch (carrying the observed
    # version), so the mismatch surfaces pre-claim instead of mid-run.
    #
    # Preflight only ever runs `<executable> --version`; it never installs or
    # upgrades host tooling. Omit this block entirely to keep today's behaviour
    # (no preflight, no gating) — it is additive.
    toolchain:
      - executable: bun
        constraint: ">=1.2 <2"
      - executable: node
        constraint: ">=22 <25"
      - executable: git
        constraint: ">=2.40"
    owned_paths_policy:
      direct:
        - source: shared/**
          requires:
            - dist/**
            - plugins/core/**
      pin_manifests:
        - event-runtime/agents/*.json
    merge_ci:
      workflow: CI
      required_checks:
        - Shadow runner fleet available
        - Verify
    escalate_paths: []

  # Add product repositories only to your ignored config/repos.yaml. Start in
  # report-only mode until their isolated worktree lifecycle is proven.
  # - name: example
  #   path: ~/Develop/example
  #   github: your-org/example
  #   team: EXAMPLE
  #   base: main
  #   report_only: true
  #   verify: bun test
