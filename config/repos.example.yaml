# Tracked example only. Run `factory init`, then edit config/repos.yaml.
# Keep machine-specific paths and private/client repository names out of git.
repos:
  # Factory can manage its own checkout. The home-relative paths are portable;
  # change them in config/repos.yaml if your checkout layout differs.
  - name: factory
    path: ~/Develop/factory
    github: watt-mind/factory
    icon: ph-robot
    color: orange
    team: WM
    project: Factory
    # Which tracker holds this repo's tickets: linear | github | memory.
    # Omit to inherit config/policy.yaml's controlPlane.kind (itself defaulting
    # to linear). Setting it per repo is what lets one factory instance run
    # this repo on GitHub Issues while every other repo it manages stays on
    # Linear — without it the choice is global and moving one moves all.
    # control_plane: github
    base: develop
    deploy_branch: main
    worktree_up: bin/worktree-up.sh
    worktree_down: bin/worktree-down.sh
    worktree_root: ~/Develop/.worktrees/factory
    max_in_flight: 20
    verify: bun test event-runtime/lib --timeout 20000 && bun build/emit.mjs --check && bun run format:check
    # Executables this repo's worktree script and verify command need, with the
    # semver range each must satisfy (WM-316, docs/event-runtime-repos.md §5).
    # Preflight resolves each one on the node and compares versions BEFORE a
    # ticket is claimed, so "this box has node 18, not 22" surfaces as a typed
    # refusal instead of a confusing agent error halfway through a run.
    #
    # It only validates: nothing here installs, upgrades, or switches a version
    # manager, and each executable is spawned exactly once as `<exe> --version`.
    # Omit the block entirely and the repo behaves as it always has — no
    # preflight, no gating.
    #
    # The map form below and the explicit list form are equivalent:
    #   toolchain:
    #     - executable: bun
    #       constraint: ">=1.3 <2"
    #
    # Constraints are validated at load: a range that is not semver (`latest`,
    # a typo) is a config error rather than a gate that silently passes.
    # The single canonical wildcard "*" means the executable must exist; any parsed version passes.
    # Other wildcard spellings are rejected because some only look constrained.
    #
    # Keep an example's floors genuinely low. This file is a LIVE fallback when
    # config/repos.yaml is absent, so a tight floor here would make the factory
    # repo refuse itself on a fresh `factory init`: `git >=2.40` rejects Debian
    # 12 (2.39.5), Ubuntu 22.04 (2.34), and older Xcode git, for no benefit.
    # Raise floors in your own config/repos.yaml, which describes one host.
    toolchain:
      bun: ">=1.3 <2"
      git: ">=2.30"
    owned_paths_policy:
      direct:
        - source: shared/**
          requires:
            - dist/**
            - plugins/core/**
      pin_manifests:
        - event-runtime/agents/*.json
      # Registry inputs change the tracked zero-pack digest baseline.
      registry_digest:
        inputs:
          - event-runtime/agents/**
          - event-runtime/event-types.json
          - event-runtime/edges.json
          - event-runtime/schedules.json
        baseline: event-runtime/lib/registry.test.mjs
    merge_ci:
      workflow: CI
      required_checks:
        - Shadow runner fleet available
        - Verify
    escalate_paths: []

  # Add product repositories only to your ignored config/repos.yaml. Start in
  # report-only mode until their isolated worktree lifecycle is proven.
  # - name: example
  #   path: ~/Develop/example
  #   github: your-org/example
  #   team: EXAMPLE
  #   base: main
  #   report_only: true
  #   verify: bun test
