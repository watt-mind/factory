# Per-node Swarm worker & race-arm roster (GH-2428).
# Copy to ~/.factory/swarm.yaml on each node and customize for the CLI
# harnesses and subscription windows available on that host.

defaults:
  worker: opus
  profile: default
  mode: sandbox # sandbox | worktree
  min_workers: 2
  timeout_seconds: 600

workers:
  opus:
    harness: claude
    model: claude-opus-5-5
    vendor: anthropic
    effort: high

  fable:
    harness: claude
    model: claude-fable-5-2
    vendor: anthropic
    effort: high

  gpt-sol:
    harness: codex
    model: gpt-6.2-sol
    vendor: openai
    effort: high
    fallback:
      harness: pi
      model: openai-codex/gpt-6.1-sol

  carbon:
    harness: agy
    model: gemini-4-carbon-high
    vendor: google
    effort: high

  argon:
    harness: agy
    model: gemini-4-argon-high
    vendor: google
    effort: high

profiles:
  # Default partition worker: single strong worker replicated across N slices.
  default:
    - opus

  # Cross-harness race arms across OpenAI, Anthropic, and Google.
  race:
    - gpt-sol
    - fable
    - carbon
