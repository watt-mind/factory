# The one source of truth for every recurring job.
#
# `bun deploy/gen.mjs` renders these into ~/Library/LaunchAgents/*.plist.
# Never hand-edit a generated plist — change it here and regenerate, or the next
# regeneration silently reverts your edit.
#
# Loops and their rationale: linear.md §14.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ WATCHED ROLLOUT: ONE CLOCK FLOOR IS ENABLED (2026-08-18).                 │
# │                                                                          │
# │ Scheduled commands admit events to the event runtime; they do not launch │
# │ ticket agents directly. Runtime proposals remain the approval boundary.  │
# │ Trust is earned one loop at a time: factory-triage is the first enabled   │
# │ floor, gated on low agent-ready supply and limited to one daily tick.     │
# │                                                                          │
# │ Enabling another loop is a deliberate reviewed decision. Observe the     │
# │ current loop before changing the next enabled flag.                      │
# └──────────────────────────────────────────────────────────────────────────┘

defaults:
  # Which repo the {{repo}} token in every command resolves to when the caller
  # does not say. One supervisor per repo is the unit of parallelism:
  #   bun orchestrator/run.mjs --repo bj29     --only triage,dispatch,merge --apply
  #   bun orchestrator/run.mjs --repo legalease --only triage,dispatch,merge --apply
  # in two terminals, each stoppable on its own.
  repo: bj29
  # Which agent CLI runs the stages: `claude`, `codex`, `pi`, `agy` (Antigravity).
  # Using different harnesses leverages different providers/quotas, so a second
  # supervisor adds capacity without drawing further on the Claude allowance.
  harness: claude
  label_prefix: com.wattmind
  log_dir: ~/Library/Logs
  # Don't fire a burst of catch-up runs when the laptop wakes from sleep.
  run_at_load: false

jobs:
  # Every apply command below uses the same small admission shim. It calls
  # the runtime's fail-soft loopback emitter, then turns a refusal/unreachable
  # runtime into a non-zero scheduler result. The timestamp makes one event ID
  # per actual tick; runtime idempotency still converges retries of that event.
  # ---------------------------------------------------------------- reaper ---
  # Returns crashed agents' Linear claims to Todo. Only touches tickets carrying
  # ai:in-progress / agent:* -- an In Progress ticket without those labels is a
  # human's work, and unassigning it would be far worse than the crashed agent
  # this cleans up after.
  #
  # Installed by hand 2026-08-03; adopted here so it stops being an orphan.
  - name: linear-reaper
    every: 15m
    dry_command: bun orchestrator/reaper.mjs
    command: >-
      bun -e 'const [type,repo,loop,cadence]=process.argv.slice(1);const at=new Date().toISOString();const payload={loop,slot:at,cadenceSeconds:Number(cadence),skippedSlots:0};const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,payload,{eventId:`schedule:${loop}:${at}`,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      clock.tick.reaper - linear-reaper 900
    enabled: false
    why: >
      Threshold is 45 minutes of silence, so 15m would sample it 3x. Disabled
      under the foreground policy above — it was loaded on 2026-08-03 and
      unloaded the same day. Run it by hand instead, and prefer the dry run
      first: `bun orchestrator/reaper.mjs` shows what it
      would reclaim, `--apply` does it. Without this running, a crashed agent
      holds its ticket until someone notices — acceptable while every run is
      watched, and the first thing to re-enable when it isn't.

  # ============================================================================
  # The loop. Commands are repo-AGNOSTIC verbs; `--repo` supplies the targets,
  # so adding legalease later is `--repo {{repo}},legalease` rather than a second
  # copy of every job. Repo-specific knowledge lives in the repo (AGENTS.md,
  # docs/product-decisions.md) and in config/repos.yaml — never in the command.
  #
  #   triage  ->  dispatch  ->  merge
  #
  # Only bj29 is targeted today: it is the only repo authorized for automated
  # dispatch. coach-wattz has lifecycle scripts (CW-363) and can be janitored
  # safely, but remains report-only until dispatch is explicitly authorized.
  #
  # WHY THE SHORT CADENCES: every stage has a `gate_command` — one cheap Linear
  # query that exits 0 when there is work and 1 when there isn't. Polling is
  # nearly free; spawning an agent costs budget. So the loop checks every few
  # minutes and acts only when something is waiting, which is what makes it feel
  # continuous instead of batch. Follow-up work filed during dispatch gets
  # triaged minutes later, not at the next 6-hour boundary.
  #
  # dry_command for every stage is the read-only queue view: "what would this
  # do" never means "spawn an agent and find out".
  # ============================================================================

  # 0. GUARD. Mechanical linear.md §5 check for `ai:agent-ready` tickets — a
  #    string/regex match against two sections, not a judgment call, so it
  #    runs before the triage agent stage instead of costing an LLM
  #    invocation every tick. Demotes a mislabeled ticket (assignee: none,
  #    state: Todo, label: ai:agent-ready — reads as dispatchable) back to
  #    Triage before dispatch could ever see it. CLNT-871/872 shipped via the
  #    4-section Frappe support-ticket template (frappe-agent-protocol.md
  #    §12) and sat unassigned in Todo, undetected, until this caught them.
  - name: label-guard
    every: 5m
    dry_command: bun orchestrator/label-guard.mjs --repo {{repo}}
    command: >-
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.label-guard.requested {{repo}} label-guard
    enabled: false
    why: >
      Checks only Owned Paths and Verification Command — the two §5 sections
      that are mechanically load-bearing (one gates dispatch's collision
      check, the other gates "done"). Deliberately does NOT check Problem &
      Context / Acceptance Criteria / Source File Pointers: an early version
      did, and against the live workspace that produced five false positives
      — including an Urgent, fully-actionable security ticket — for every two
      genuine catches, because those three vary too much in legitimate format
      to check safely by regex. A false demotion costs real disruption to a
      ready ticket, so this errs toward precision. Disabled under the
      foreground policy above like everything else here — run by hand, dry
      first, before enabling.

  # 1. INTAKE. Usually the binding constraint — a deep Triage pile with an empty
  #    agent-ready queue means dispatching harder cannot help.
  #
  #    --args caps WORK PER TICK, which is what keeps a 5-minute loop from
  #    turning 14 Triage tickets into 14 specs in one unattended run. Small
  #    ticks also fail small: a bad spec costs one ticket, not a backlog. Raise
  #    it once you have watched a few passes.
  - name: triage
    every: 5m
    gate_command: bun orchestrator/queue.mjs --repo {{repo}} --gate triage
    # The gate embedded in `command` below is the launchd path (each plist runs
    # `command` alone); under orchestrator/run.mjs, which runs gate_command
    # separately first, it is a redundant second check.
    dry_command: bun orchestrator/queue.mjs --repo {{repo}}
    command: >-
      { code=0; bun orchestrator/queue.mjs --repo {{repo}} --gate triage || code=$?; if [ "$code" -eq 1 ]; then echo "{{repo}}: triage gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.triage.requested {{repo}} triage; }
    enabled: false
    why: >
      Turns Triage tickets into ai:agent-ready ones by exploring the codebase,
      and batches the genuinely human questions into one notification instead of
      a ping per ticket. Read-only against the repo — it needs the code to write
      Source File Pointers and Owned Paths, but never a worktree.

  # 1b. WARM. Worktree creation clones node_modules and the build cache from a
  #     template. Stale template => the clone is worthless and every ticket pays
  #     a full compile: at 99 commits behind that was ~3 minutes per worktree,
  #     ~9 minutes of wall clock for three tickets before any code got written.
  - name: warm
    every: 2h
    gate_command: bun orchestrator/warm.mjs --repo {{repo}} --gate
    dry_command: bun orchestrator/warm.mjs --repo {{repo}}
    command: >-
      { code=0; bun orchestrator/warm.mjs --repo {{repo}} --gate || code=$?; if [ "$code" -eq 1 ]; then echo "{{repo}}: warm gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.warm.requested {{repo}} warm; }
    enabled: false
    why: >
      Compiles once so that N worktrees don't. Cheapest thing to run before a
      dispatch batch; the gate only fires when the cache is >=15 commits behind.

  # 1c. UNBLOCK. `ai:blocked` used to be a one-way door; reply detection
  #     (OPS-65) catches answered questions, and these two catch the rest:
  #     the digest surfaces every hold's question in one read-only report, and
  #     the sweep re-examines holds for evidence that resolved them without a
  #     comment (dependency merged, credential documented, code moved on).
  #
  #     BOTH ARE MANUAL-START BY DESIGN (OPS-67), not just disabled-for-now:
  #     the digest from the watch TUI's `b` or this CLI, the sweep from the
  #     TUI's `u` (spawns immediately, no dry step — it is Linear-write-only
  #     and rule-bound to touch nothing without new evidence).
  #     Listed here so the verbs have one canonical spelling and don't become
  #     orphans like the reaper once was.
  - name: unblock-digest
    every: 24h
    dry_command: bun orchestrator/digest.mjs
    command: >-
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.unblock-digest.requested {{repo}} unblock-digest
    enabled: false
    why: >
      Read-only report of every ai:blocked ticket with its blocking question,
      hold age, and ANSWERED markers. There is no push channel for it yet, so
      scheduling it would print to a log nobody reads — run it when you want
      the picture.
  - name: unblock
    every: 24h
    dry_command: bun orchestrator/digest.mjs --repo {{repo}}
    command: >-
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.unblock.requested {{repo}} unblock
    enabled: false
    why: >
      Agent pass over held tickets, oldest first: releases a hold only on new
      evidence (dependency Done, answer now in docs, premise gone from the
      code) and otherwise leaves silently — never re-derives or re-comments a
      hold. Read-only against the repo; writes only to Linear. Manual-start
      until it has earned schedule trust like everything else here.

  # 2. EXECUTE. Rolling dispatch under the per-repo in-flight cap; Owned Paths
  #    decide what can run together. The gate refuses to spawn when the cap is
  #    full or nothing is startable, so an agent never wakes to learn nothing.
  - name: dispatch
    every: 5m
    gate_command: bun orchestrator/queue.mjs --repo {{repo}} --gate dispatch
    dry_command: bun orchestrator/queue.mjs --repo {{repo}}
    command: >-
      { code=0; bun orchestrator/queue.mjs --repo {{repo}} --gate dispatch || code=$?; if [ "$code" -eq 1 ]; then echo "{{repo}}: dispatch gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.work.requested {{repo}} dispatch; }
    enabled: false
    why: >
      Emits factory.work.requested. The runtime work-scan selects bounded,
      non-colliding tickets and emits one factory.dispatch.requested event per
      candidate; dispatch then owns the claim and delegated worktree lifecycle.

  # 2b. RECONCILE. A ticket left In Progress after its PR is open holds a
  #     dispatch slot forever, and nothing reports it because a stuck ticket
  #     looks exactly like a working one. bj29 ran at one agent of three for 13
  #     hours this way. Only ever moves In Progress -> In Review, and only for
  #     tickets that have also gone quiet, so a live agent keeps its slot.
  - name: reconcile
    every: 10m
    gate_command: bun orchestrator/reconcile.mjs --repo {{repo}} --gate
    dry_command: bun orchestrator/reconcile.mjs --repo {{repo}}
    command: >-
      { code=0; bun orchestrator/reconcile.mjs --repo {{repo}} --gate || code=$?; if [ "$code" -eq 1 ]; then echo "{{repo}}: reconcile gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.reconcile.requested {{repo}} reconcile; }
    enabled: false
    why: >
      Positive evidence, not silence: an open PR means the implementation phase
      is over, whatever the ticket says. Complements the reaper, which asks a
      different question (has this claim gone silent) and cannot see a finished
      ticket that simply never moved. Never merges and never moves anything to
      Done — Done needs base CI and the smoke check, which is the merge stage's
      call.

  # 3. LAND. Merging is always serialized — two PRs landing in one base within
  #    seconds produce a base-CI failure belonging to neither.
  - name: merge
    every: 10m
    gate_command: bun orchestrator/queue.mjs --repo {{repo}} --gate merge
    dry_command: bun orchestrator/queue.mjs --repo {{repo}}
    command: >-
      { code=0; bun orchestrator/queue.mjs --repo {{repo}} --gate merge || code=$?; if [ "$code" -eq 1 ]; then echo "{{repo}}: merge gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.merge.requested {{repo}} merge; }
    enabled: false
    why: >
      Reviews In Review PRs as their CI finishes, fixes what is mechanical,
      merges what qualifies into develop, and moves tickets to Done once base CI
      and the dev smoke check are green. Escalation list still applies: payments,
      auth and migrations never auto-merge in this client repo.

  # 4. RECLAIM. Worktrees whose tickets finished. The merge stage is supposed to
  #    tear its own down, but crashed runs, hand-merges and tickets closed in
  #    Linear all leave orphans — and an orphan looks exactly like live work, so
  #    nothing notices until the disk does. bj29 had 20 of them at 89% full.
  - name: janitor
    every: 1h
    gate_command: bun orchestrator/janitor.mjs --repo {{repo}} --gate
    dry_command: bun orchestrator/janitor.mjs --repo {{repo}}
    command: >-
      { code=0; bun orchestrator/janitor.mjs --repo {{repo}} --gate || code=$?; if [ "$code" -eq 1 ]; then echo "{{repo}}: janitor gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.janitor-scan.requested {{repo}} janitor; }
    enabled: false
    why: >
      Emits a read-only janitor scan; only typed SAFE results chain to the
      runtime's apply node. The apply node calls the repo's worktree-down.sh
      WITHOUT --force, so uncommitted or unpushed work refuses removal. Never
      add --force: losing an agent's unpushed work is worse than the disk.

  # =============================================================== factory ===
  # The factory repo's own liveness floor. The chain is primary: work-scan
  # emits triage when supply is low, and completed dispatches re-fire work.
  # These clocks only prevent cold start/new intake from leaving the factory
  # asleep forever. Triage is enabled first, watched through the runtime, and
  # capped by its existing queue gate; dispatch, merge, and reaper stay off
  # until the preceding loop has been observed and explicitly promoted.
  - name: factory-triage
    every: 24h
    gate_command: bun orchestrator/queue.mjs --repo factory --gate triage
    dry_command: bun orchestrator/queue.mjs --repo factory
    command: >-
      { code=0; bun orchestrator/queue.mjs --repo factory --gate triage || code=$?; if [ "$code" -eq 1 ]; then echo "factory: triage gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.triage.requested factory factory-triage; }
    enabled: true
    why: >
      Daily cold-start/new-intake floor for the chain-first supply loop. The
      gate admits a watched triage proposal only when agent-ready supply is
      low and actionable Triage work exists; otherwise the tick is a cheap,
      observable no-op. This is the first and only newly enabled loop.

  - name: factory-dispatch
    every: 5m
    gate_command: bun orchestrator/queue.mjs --repo factory --gate dispatch
    dry_command: bun orchestrator/queue.mjs --repo factory
    command: >-
      { code=0; bun orchestrator/queue.mjs --repo factory --gate dispatch || code=$?; if [ "$code" -eq 1 ]; then echo "factory: dispatch gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.work.requested factory factory-dispatch; }
    enabled: false
    why: >
      Five-minute fallback matching the existing dispatch cadence. The runtime
      work-scan/dispatch chain is the primary trigger; keep this floor disabled
      until the triage floor has earned promotion.

  - name: factory-merge
    every: 10m
    gate_command: bun orchestrator/queue.mjs --repo factory --gate merge
    dry_command: bun orchestrator/queue.mjs --repo factory
    command: >-
      { code=0; bun orchestrator/queue.mjs --repo factory --gate merge || code=$?; if [ "$code" -eq 1 ]; then echo "factory: merge gate idle; no event admitted"; exit 0; elif [ "$code" -ne 0 ]; then exit "$code"; fi;
      bun -e 'const [type,repo,loop]=process.argv.slice(1);const at=new Date().toISOString();const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,{repo},{eventId:`schedule:${loop}:${repo}:${at}`,subject:repo,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      factory.merge.requested factory factory-merge; }
    enabled: false
    why: >
      Ten-minute fallback matching the existing merge cadence. Merge changes
      repository state and is deliberately last in the watched rollout.

  - name: factory-reaper
    every: 60m
    dry_command: bun orchestrator/reaper.mjs
    command: >-
      bun -e 'const [type,repo,loop,cadence]=process.argv.slice(1);const at=new Date().toISOString();const payload={loop,slot:at,cadenceSeconds:Number(cadence),skippedSlots:0};const outcome=await (await import("./lib/emit-event.mjs")).emitFactoryEvent(type,payload,{eventId:`schedule:${loop}:${at}`,occurredAt:at});if(!outcome?.admitted&&!outcome?.duplicate)throw new Error("event runtime refused or unreachable");console.log(JSON.stringify(outcome))'
      clock.tick.reaper - factory-reaper 3600
    enabled: false
    why: >
      Hourly global stale-claim cleanup associated with the factory control
      plane. It has no repo gate because reaper safety comes from its strict
      ai:in-progress/agent:* predicate and the runtime approval boundary.
