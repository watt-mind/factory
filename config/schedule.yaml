# The one source of truth for every recurring job.
#
# `bun deploy/gen.mjs` renders these into ~/Library/LaunchAgents/*.plist.
# Never hand-edit a generated plist — change it here and regenerate, or the next
# regeneration silently reverts your edit.
#
# Loops and their rationale: linear.md §14.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ EVERYTHING IS DISABLED ON PURPOSE (2026-08-03).                          │
# │                                                                          │
# │ Standing policy for now: the factory runs in the FOREGROUND, watched.    │
# │ No launchd job may act on Linear, git, or CI without someone looking at  │
# │ it. Nothing here has eval coverage yet, per-agent identity doesn't exist │
# │ (OPS-40), and the reaper has already demonstrated it can act on 31       │
# │ tickets from one bad predicate. Trust is earned one loop at a time.      │
# │                                                                          │
# │ Enabling anything here is a deliberate decision, not a default. Flip one │
# │ job, watch it for a week, then consider the next.                        │
# └──────────────────────────────────────────────────────────────────────────┘

defaults:
  # Which repo the {{repo}} token in every command resolves to when the caller
  # does not say. One supervisor per repo is the unit of parallelism:
  #   bun orchestrator/run.mjs --repo bj29     --only triage,dispatch,merge --apply
  #   bun orchestrator/run.mjs --repo legalease --only triage,dispatch,merge --apply
  # in two terminals, each stoppable on its own.
  repo: bj29
  # Which agent CLI runs the stages: `claude`, `codex`, `pi`, `agy` (Antigravity).
  # Using different harnesses leverages different providers/quotas, so a second
  # supervisor adds capacity without drawing further on the Claude allowance.
  harness: claude
  label_prefix: com.wattmind
  log_dir: ~/Library/Logs
  # Don't fire a burst of catch-up runs when the laptop wakes from sleep.
  run_at_load: false

jobs:
  # ---------------------------------------------------------------- reaper ---
  # Returns crashed agents' Linear claims to Todo. Only touches tickets carrying
  # ai:in-progress / agent:* -- an In Progress ticket without those labels is a
  # human's work, and unassigning it would be far worse than the crashed agent
  # this cleans up after.
  #
  # Installed by hand 2026-08-03; adopted here so it stops being an orphan.
  - name: linear-reaper
    every: 15m
    dry_command: bun orchestrator/reaper.mjs
    command: bun orchestrator/reaper.mjs --apply
    enabled: false
    why: >
      Threshold is 45 minutes of silence, so 15m would sample it 3x. Disabled
      under the foreground policy above — it was loaded on 2026-08-03 and
      unloaded the same day. Run it by hand instead, and prefer the dry run
      first: `bun orchestrator/reaper.mjs` shows what it
      would reclaim, `--apply` does it. Without this running, a crashed agent
      holds its ticket until someone notices — acceptable while every run is
      watched, and the first thing to re-enable when it isn't.

  # ============================================================================
  # The loop. Commands are repo-AGNOSTIC verbs; `--repo` supplies the targets,
  # so adding legalease later is `--repo {{repo}},legalease` rather than a second
  # copy of every job. Repo-specific knowledge lives in the repo (AGENTS.md,
  # docs/product-decisions.md) and in config/repos.yaml — never in the command.
  #
  #   triage  ->  dispatch  ->  merge
  #
  # Only bj29 is targeted today: it is the one repo satisfying PC-15
  # (industrialized worktrees), which is what makes concurrent agents safe.
  # coach-wattz and legalease join the --repo list when CW-363/CLNT-609 land.
  #
  # WHY THE SHORT CADENCES: every stage has a `gate_command` — one cheap Linear
  # query that exits 0 when there is work and 1 when there isn't. Polling is
  # nearly free; spawning an agent costs budget. So the loop checks every few
  # minutes and acts only when something is waiting, which is what makes it feel
  # continuous instead of batch. Follow-up work filed during dispatch gets
  # triaged minutes later, not at the next 6-hour boundary.
  #
  # dry_command for every stage is the read-only queue view: "what would this
  # do" never means "spawn an agent and find out".
  # ============================================================================

  # 1. INTAKE. Usually the binding constraint — a deep Triage pile with an empty
  #    agent-ready queue means dispatching harder cannot help.
  #
  #    --args caps WORK PER TICK, which is what keeps a 5-minute loop from
  #    turning 14 Triage tickets into 14 specs in one unattended run. Small
  #    ticks also fail small: a bad spec costs one ticket, not a backlog. Raise
  #    it once you have watched a few passes.
  - name: triage
    every: 5m
    gate_command: bun orchestrator/queue.mjs --repo {{repo}} --gate triage
    dry_command: bun orchestrator/queue.mjs --repo {{repo}}
    command: runners/run-agent.sh --harness {{harness}} --repo {{repo}} --command factory-triage --read-only --args "5"
    enabled: false
    why: >
      Turns Triage tickets into ai:agent-ready ones by exploring the codebase,
      and batches the genuinely human questions into one notification instead of
      a ping per ticket. Read-only against the repo — it needs the code to write
      Source File Pointers and Owned Paths, but never a worktree.

  # 1b. WARM. Worktree creation clones node_modules and the build cache from a
  #     template. Stale template => the clone is worthless and every ticket pays
  #     a full compile: at 99 commits behind that was ~3 minutes per worktree,
  #     ~9 minutes of wall clock for three tickets before any code got written.
  - name: warm
    every: 2h
    gate_command: bun orchestrator/warm.mjs --repo {{repo}} --gate
    dry_command: bun orchestrator/warm.mjs --repo {{repo}}
    command: bun orchestrator/warm.mjs --repo {{repo}} --apply
    enabled: false
    why: >
      Compiles once so that N worktrees don't. Cheapest thing to run before a
      dispatch batch; the gate only fires when the cache is >=15 commits behind.

  # 1c. UNBLOCK. `ai:blocked` used to be a one-way door; reply detection
  #     (OPS-65) catches answered questions, and these two catch the rest:
  #     the digest surfaces every hold's question in one read-only report, and
  #     the sweep re-examines holds for evidence that resolved them without a
  #     comment (dependency merged, credential documented, code moved on).
  #
  #     BOTH ARE MANUAL-START BY DESIGN (OPS-67), not just disabled-for-now:
  #     the digest from the watch TUI's `b` or this CLI, the sweep from the
  #     TUI's `u` (spawns immediately, no dry step — it is Linear-write-only
  #     and rule-bound to touch nothing without new evidence) or run-agent.sh.
  #     Listed here so the verbs have one canonical spelling and don't become
  #     orphans like the reaper once was.
  - name: unblock-digest
    every: 24h
    dry_command: bun orchestrator/digest.mjs
    command: bun orchestrator/digest.mjs
    enabled: false
    why: >
      Read-only report of every ai:blocked ticket with its blocking question,
      hold age, and ANSWERED markers. There is no push channel for it yet, so
      scheduling it would print to a log nobody reads — run it when you want
      the picture.
  - name: unblock
    every: 24h
    dry_command: bun orchestrator/digest.mjs --repo {{repo}}
    command: runners/run-agent.sh --harness {{harness}} --repo {{repo}} --command factory-unblock --read-only --args "10"
    enabled: false
    why: >
      Agent pass over held tickets, oldest first: releases a hold only on new
      evidence (dependency Done, answer now in docs, premise gone from the
      code) and otherwise leaves silently — never re-derives or re-comments a
      hold. Read-only against the repo; writes only to Linear. Manual-start
      until it has earned schedule trust like everything else here.

  # 2. EXECUTE. Rolling dispatch under the per-repo in-flight cap; Owned Paths
  #    decide what can run together. The gate refuses to spawn when the cap is
  #    full or nothing is startable, so an agent never wakes to learn nothing.
  - name: dispatch
    every: 5m
    gate_command: bun orchestrator/queue.mjs --repo {{repo}} --gate dispatch
    dry_command: bun orchestrator/queue.mjs --repo {{repo}}
    command: bun orchestrator/tick.mjs --repo {{repo}} --harness {{harness}} --apply
    enabled: false
    why: >
      One OS PROCESS PER TICKET: tick.mjs claims, builds the worktree via
      bin/worktree-up.sh, then spawns `claude -p /factory-ticket <ID>` in it.
      Each ticket gets its own log, budget and session id, so one stuck ticket
      can be killed alone and one failed ticket resumed alone.

  # 2b. RECONCILE. A ticket left In Progress after its PR is open holds a
  #     dispatch slot forever, and nothing reports it because a stuck ticket
  #     looks exactly like a working one. bj29 ran at one agent of three for 13
  #     hours this way. Only ever moves In Progress -> In Review, and only for
  #     tickets that have also gone quiet, so a live agent keeps its slot.
  - name: reconcile
    every: 10m
    gate_command: bun orchestrator/reconcile.mjs --repo {{repo}} --gate
    dry_command: bun orchestrator/reconcile.mjs --repo {{repo}}
    command: bun orchestrator/reconcile.mjs --repo {{repo}} --apply
    enabled: false
    why: >
      Positive evidence, not silence: an open PR means the implementation phase
      is over, whatever the ticket says. Complements the reaper, which asks a
      different question (has this claim gone silent) and cannot see a finished
      ticket that simply never moved. Never merges and never moves anything to
      Done — Done needs base CI and the smoke check, which is the merge stage's
      call.

  # 3. LAND. Merging is always serialized — two PRs landing in one base within
  #    seconds produce a base-CI failure belonging to neither.
  - name: merge
    every: 10m
    gate_command: bun orchestrator/queue.mjs --repo {{repo}} --gate merge
    dry_command: bun orchestrator/queue.mjs --repo {{repo}}
    command: runners/run-agent.sh --harness {{harness}} --repo {{repo}} --command factory-merge
    enabled: false
    why: >
      Reviews In Review PRs as their CI finishes, fixes what is mechanical,
      merges what qualifies into develop, and moves tickets to Done once base CI
      and the dev smoke check are green. Escalation list still applies: payments,
      auth and migrations never auto-merge in this client repo.

  # 4. RECLAIM. Worktrees whose tickets finished. The merge stage is supposed to
  #    tear its own down, but crashed runs, hand-merges and tickets closed in
  #    Linear all leave orphans — and an orphan looks exactly like live work, so
  #    nothing notices until the disk does. bj29 had 20 of them at 89% full.
  - name: janitor
    every: 1h
    gate_command: bun orchestrator/janitor.mjs --repo {{repo}} --gate
    dry_command: bun orchestrator/janitor.mjs --repo {{repo}}
    command: bun orchestrator/janitor.mjs --repo {{repo}} --apply
    enabled: false
    why: >
      Calls the repo's worktree-down.sh WITHOUT --force, so anything holding
      uncommitted or unpushed work refuses to be removed and is reported
      instead. Never add --force: losing an agent's unpushed work is far worse
      than the disk it occupies.
