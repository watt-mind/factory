# Tracked example only. Run `factory init`, then edit config/policy.yaml.
# Keep organization billing details, notification paths, and private policy out
# of git. Defaults below are deliberately conservative.

packs: []
extensions: []

# Workspace-only model runs fail closed when this host cannot provide the
# Gondolin guest boundary. An operator may temporarily accept host execution
# by naming, one by one, the agents they accept running unconfined. Nothing is
# enabled by default: absent, malformed, and unknown values all keep the
# refusal. An agent missing from `agents` is refused exactly as before, with a
# reason naming the missing host capability (`sandbox_unavailable:qemu`).
#
# The grant applies ONLY on a host whose sandbox preflight fails, and only to
# definitions that carry no `sandbox:` block of their own — an authored
# definition policy always wins. Mutating agents never reach this gate.
# Every admitted run records `filesystemConfinement.status: unconfined` in its
# receipt. Prefer installing QEMU/Gondolin and leaving this absent; see
# docs/event-runtime-adapters.md.
# sandbox:
#   workspace_only_fallback:
#     mode: host
#     agents:
#       - work-scan
#       - triage-scan
#       - ci-doctor
#       - ci-log-capture
#       - janitor-scan
#       - merge-scan
#       - merge-review
#       - merge-plan
#       - sweep-scan
#       - ship-scan
#       - unblock-scan
#       - unblock-digest
#       - run-postmortem
#       - factory-status-report
#       - disk-diagnose
#
# The bare string form `workspace_only_fallback: host` is still accepted for
# instances configured before the allow-list landed. It means "every
# workspace-only agent", logs a loud warning on every claim, and should be
# replaced by the explicit form above.

chain_auto_approval:
  # New installations may opt into this closed set after reviewing their
  # tracker, credentials, and merge policy.
  allowed_event_types:
    - factory.work.requested
    - factory.triage.requested
    - factory.triage-apply.requested
    - factory.dispatch.requested
    - factory.ci-diagnose.requested
    - factory.merge.requested
    - factory.merge-review.requested
    - factory.merge-fix.requested
    - factory.merge-plan.requested
    - factory.merge-apply.requested
    - factory.merge-landed
    - factory.merge-verify.requested
    - factory.merge-escalate.requested

merge:
  max_fix_rounds: 2
  batch_size: 4

forge:
  kind: github

controlPlane:
  kind: linear

commitMsg:
  # Ticket-reference shapes the commit-msg hook accepts, as ERE alternatives.
  # Omit the stanza to use the built-in default, which is exactly these two:
  # any 2-5 letter tracker prefix, plus the GitHub issue form. Listing both is
  # deliberate during a tracker cutover — historical `(ABC-123)` refs and new
  # `(#123)` refs stay valid at the same time, with no hook edit.
  #
  # Setting this REPLACES the default rather than adding to it.
  ticketPatterns:
    - '\([A-Z]{2,5}-[0-9]+\)'
    - '\(#[0-9]+\)'

dispatch:
  owned_paths_collision: advisory
  owned_paths_conformance: advisory
  # Whether the work loop may dispatch `type:security` tickets (WM-1060).
  #   excluded — only an operator-sourced dispatch works one (fail-closed default).
  #   auto     — the loop dispatches them too; the merge lane still refuses to
  #              merge a security PR, so it is held for human merge, never
  #              auto-merged. The escalate_paths gate still guards touched files.
  security_tickets: excluded

concurrency:
  max_in_flight_per_repo: 20
  max_concurrent_merges: 1

workers:
  min: 1
  max: 20

actions_cache:
  # GitHub's cache API reports decimal bytes. Set included_gb to your plan's
  # included allowance and update it if GitHub billing shows a different one.
  organization: watt-mind
  included_gb: 73
  # `factory actions-cache` exits non-zero at this threshold, before billing risk.
  warning_percent: 60

budget:
  # Notional API-equivalent runaway guards; adjust for your adapter/provider.
  per_ticket_usd: 15
  merge_usd: 40
  per_day_usd: 2000
  on_exhausted: drain

models:
  # Change these provider model identifiers for your authenticated CLIs.
  claude:
    strong: default
    standard: sonnet
    light: haiku
  pi:
    strong: openai-codex/gpt-5.6-sol
    standard: openai-codex/gpt-5.6-terra
    light: openai-codex/gpt-5.6-luna
  agy:
    strong: gemini-3.7-flash
    standard: gemini-3.7-flash
    light: gemini-3.7-flash
  cursor:
    strong: cursor-grok-4.6-high
    standard: cursor-grok-4.6-high
    light: cursor-grok-4.6-low-fast

# Grader pin for `evals/run.mjs`. A real run refuses to start without this;
# `--dry-run` still works so discovery stays testable. `grader.model` must
# name a real model (`default` is refused) so a grader upgrade is reviewable.
evals:
  subject:
    model: default
  grader:
    model: claude-sonnet-4-6
  limits:
    case_timeout_seconds: 300
    case_budget_usd: 2.00
    total_seconds: 3600
    total_budget_usd: 20.00

limits:
  max_run_minutes: 90

circuit_breaker:
  consecutive_env_failures: 2

escalation:
  never_auto_merge:
    - auth / authz
    - payments / money movement
    - credential and secret handling
    - destructive DB migrations
    - production infra config
  auto_merge_base: [develop]
  auto_merge_owners: []

notify:
  on:
    - ticket_blocked
    - pr_escalated
    - base_ci_red
    - smoke_red
    - circuit_breaker_tripped
    - release_candidate_ready

# Instance-local host allowlist for the disk maintenance agents
# (disk-diagnose / disk-remediate). The tracked agent definitions ship with an
# empty allowlist on purpose — set your own targets here (or leave unset to
# keep the disk agents refusing).
# agents:
#   disk:
#     hosts:
#       lab: root@203.0.113.10
#       web: ops@203.0.113.20
