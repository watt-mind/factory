name: Browser E2E

on:
  workflow_dispatch:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        labeled,
        ready_for_review,
        converted_to_draft,
      ]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Playwright smoke journeys
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'run-e2e')
        )
      }}
    runs-on: [self-hosted, shadow]
    timeout-minutes: 45
    steps:
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Setup bun (no action download)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.bun/bin/bun" ] && ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
          fi
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            "$HOME/.bun/bin/bun" --version
          else
            bun --version
          fi

      - name: Acquire host verify lock
        id: e2e-lock
        shell: bash
        run: |
          set -euo pipefail
          # The shadow runners share one host with CI's unit/integration jobs.
          # Reuse their lock: a second lock lane would allow CPU-heavy suites
          # to overlap on the same machine and recreate the flake this protects.
          lock="/tmp/factory-verify-host.lock"
          state_dir="$(mktemp -d "$RUNNER_TEMP/factory-e2e-lock.XXXXXX")"
          ready="$state_dir/ready"
          mkfifo "$ready"
          # --no-fork preserves one PID while flock waits and after it execs the
          # guardian, so killing that PID cannot leave a child waiter behind.
          flock --no-fork "$lock" bash -c '
            printf "acquired\n" > "$1"
            exec tail -f /dev/null >/dev/null 2>&1
          ' _ "$ready" &
          guardian=$!

          # Cancelled PR runs must not leave a queued flock waiter behind until
          # runner cleanup. The EXIT trap owns the waiter until lock handoff.
          cleanup_waiter() {
            kill "$guardian" 2>/dev/null || true
            rm -rf "$state_dir"
          }
          trap cleanup_waiter EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          read -r _ < "$ready"
          trap - EXIT INT TERM
          rm -f "$ready"
          echo "guardian=$guardian" >> "$GITHUB_OUTPUT"
          echo "state_dir=$state_dir" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd event-runtime/web
          bun install --frozen-lockfile

      - name: Resolve pinned Playwright version
        id: playwright
        shell: bash
        run: |
          set -euo pipefail
          # Single source: event-runtime/web/e2e/playwright-version.mjs (also
          # read by package.json `test:e2e`), so the pin can never drift.
          version="$(bun event-runtime/web/e2e/playwright-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "browsers_path=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "Playwright $version"

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        shell: bash
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
          BROWSERS_PATH: ${{ steps.playwright.outputs.browsers_path }}
        run: |
          set -euo pipefail
          # No `uses:` steps on the shadow runner (WM-573), so the cache is the
          # runner's persistent ~/.cache/ms-playwright keyed on the pinned
          # Playwright version: a marker per version says the matching
          # Chromium build finished downloading.
          marker="$BROWSERS_PATH/.factory-e2e-chromium-$PLAYWRIGHT_VERSION"
          if [ -f "$marker" ]; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
            echo "Playwright $PLAYWRIGHT_VERSION Chromium already cached in $BROWSERS_PATH"
          else
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
            echo "No cached Chromium for Playwright $PLAYWRIGHT_VERSION"
          fi

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
          BROWSERS_PATH: ${{ steps.playwright.outputs.browsers_path }}
        run: |
          set -euo pipefail
          cd event-runtime/web
          bunx --bun "@playwright/test@$PLAYWRIGHT_VERSION" install chromium
          touch "$BROWSERS_PATH/.factory-e2e-chromium-$PLAYWRIGHT_VERSION"

      - name: Run browser smoke journeys
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: cd event-runtime/web && bun run test:e2e

      - name: Release host verify lock
        if: always() && steps.e2e-lock.outputs.guardian != ''
        shell: bash
        env:
          GUARDIAN_PID: ${{ steps.e2e-lock.outputs.guardian }}
          LOCK_STATE_DIR: ${{ steps.e2e-lock.outputs.state_dir }}
        run: |
          kill "$GUARDIAN_PID" 2>/dev/null || true
          rm -rf "$LOCK_STATE_DIR"
