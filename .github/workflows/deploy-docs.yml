name: Deploy Documentation

on:
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Starlight Site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Setup bun (no action download)
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/install-pinned-tools.sh bun

      - name: Install dependencies
        run: |
          cd site
          bun install --frozen-lockfile

      - name: Build documentation site
        run: |
          cd site
          bun run build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    # deploy-pages is a tiny OIDC handshake; no self-hosted runner carries a
    # smoke-test label, so this job could never schedule there (first main
    # deploy failed with an unschedulable job). GitHub-hosted is correct here.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
