name: Deploy Documentation

on:
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Starlight Site
    # Fork pull requests never reach the persistent [self-hosted, shadow] fleet:
    # this job-level gate is evaluated before scheduling, so no fork-controlled
    # code (checkout, bun install, build) executes on a shared runner. Pushes
    # and workflow_dispatch are trusted; pull requests must originate from a
    # branch of this repository. Deliberately not pull_request_target — that
    # would run fork code with repository-scoped credentials.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, shadow]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: |
          cd site
          bun install --frozen-lockfile

      - name: Build documentation site
        run: |
          cd site
          bun run build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    # deploy-pages is a tiny OIDC handshake; no self-hosted runner carries a
    # smoke-test label, so this job could never schedule there (first main
    # deploy failed with an unschedulable job). GitHub-hosted is correct here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
