name: Publish npm package

# Publishes @watt-mind/factory when a merge to main carries a package.json
# version that is not on the registry yet. Re-runs are no-ops (idempotent):
# an already-published version skips cleanly instead of failing the run.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm --provenance (OIDC attestation)

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    # GitHub-hosted so OIDC provenance works and no instance state is nearby.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Gate the tarball (no instance config, valid manifest)
        run: bun tools/publish.mjs --dry-run
      - name: Skip if this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already on the registry — skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
