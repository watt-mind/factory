name: Security

on:
  pull_request:
  push:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read

# One live run per PR, and one per pushed branch: a newer push to develop
# supersedes the older develop run (WM-773 item 6) — a stale develop SHA green
# proves nothing and used to cost a full lane hold per merge.
concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  gitleaks:
    name: Gitleaks
    # Cloud runner per OSS security policy (WM-950).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          zeros="0000000000000000000000000000000000000000"
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch -q --depth=50 origin "$SHA" "$BASE_SHA"
            git checkout -q "$SHA"
            depth=50
            while ! git merge-base "$BASE_SHA" "$SHA" >/dev/null 2>&1; do
              if [ "$depth" -ge 2000 ]; then
                echo "::warning::could not connect base $BASE_SHA to head $SHA within $depth commits; falling back to full history"
                git fetch -q --unshallow origin || git fetch -q origin "$BASE_SHA" "$SHA"
                break
              fi
              depth=$((depth * 4))
              git fetch -q --deepen="$depth" origin "$SHA" "$BASE_SHA"
            done
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$zeros" ]; then
            # `before` is normally the parent (or first parent of a merge) of
            # SHA, so depth 2 covers the common single-commit push; deepen
            # from SHA only if the pushed range is longer.
            git fetch -q --depth=2 origin "$SHA"
            git checkout -q "$SHA"
            depth=2
            while ! git rev-parse -q --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; do
              if [ "$depth" -ge 2000 ]; then
                echo "::warning::could not reach before $BEFORE_SHA from head $SHA within $depth commits; falling back to full history"
                git fetch -q --unshallow origin || git fetch -q origin "$SHA" "$BEFORE_SHA"
                break
              fi
              depth=$((depth * 4))
              git fetch -q --deepen="$depth" origin "$SHA"
            done
          else
            git fetch -q --depth 1 origin "$SHA"
            git checkout -q FETCH_HEAD
          fi
          git log -1 --oneline

      - name: Resolve gitleaks binary
        id: gitleaks-bin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if command -v gitleaks >/dev/null 2>&1; then
            echo "bin=gitleaks" >> "$GITHUB_OUTPUT"
          elif [ -x "$HOME/.local/bin/gitleaks" ]; then
            echo "bin=$HOME/.local/bin/gitleaks" >> "$GITHUB_OUTPUT"
          else
            # Pinned release download (WM-950)
            tag="v8.24.0"
            ver="${tag#v}"
            archive="$RUNNER_TEMP/gitleaks_${ver}_linux_x64.tar.gz"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$archive" \
              "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${ver}_linux_x64.tar.gz"
            echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$HOME/.local/bin" gitleaks
            chmod +x "$HOME/.local/bin/gitleaks"
            echo "bin=$HOME/.local/bin/gitleaks" >> "$GITHUB_OUTPUT"
          fi

      - name: Gitleaks scan
        shell: bash
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks-bin.outputs.bin }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # .gitleaks.toml at repo root is auto-loaded by gitleaks if present;
          # it allowlists the known false positives so the `-1` fallback (a
          # depth-1 clone, whole tree as one diff) is clean too (WM-620).
          zeros="0000000000000000000000000000000000000000"
          if [ -n "${BASE_SHA:-}" ]; then
            log_opts="${BASE_SHA}..${SHA}"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$zeros" ] \
            && git rev-parse -q --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            log_opts="${BEFORE_SHA}..${SHA}"
          else
            log_opts="-1"
          fi
          echo "gitleaks log opts: $log_opts"
          "$GITLEAKS_BIN" git --no-banner --redact --log-opts="$log_opts"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      # uv is on the runner host per code-security.md §4 tier 2b; only install
      # a checksum-pinned release archive if it is missing.
      - name: Setup uv (no action download)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v uvx >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/uvx" ]; then
            version="0.6.5"
            archive="$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu.tar.gz"
            extract_dir="$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu"
            mkdir -p "$HOME/.local/bin"
            rm -rf "$extract_dir"
            curl -fsSL -o "$archive" \
              "https://github.com/astral-sh/uv/releases/download/${version}/uv-x86_64-unknown-linux-gnu.tar.gz"
            echo "8fc9895719a1291ecd193cb86f9282ff3649cef797d29eacc74c4f573aab1e2f  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            install -m 0755 "$extract_dir/uv" "$extract_dir/uvx" "$HOME/.local/bin/"
          fi
          # $GITHUB_PATH only takes effect starting the *next* step, not this
          # one — resolve the binary directly here rather than relying on PATH.
          if [ -x "$HOME/.local/bin/uvx" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            uvx_bin="$HOME/.local/bin/uvx"
          else
            uvx_bin="uvx"
          fi
          "$uvx_bin" --version

      - name: Semgrep scan
        run: uvx --from semgrep==1.111.0 --with "setuptools<70" semgrep scan --config p/security-audit --error --metrics=off .

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Resolve actionlint binary
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v actionlint >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/actionlint" ]; then
            version="1.7.7"
            archive="$RUNNER_TEMP/actionlint_${version}_linux_amd64.tar.gz"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL -o "$archive" \
              "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
            echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$HOME/.local/bin" actionlint
            chmod +x "$HOME/.local/bin/actionlint"
          fi
          # $GITHUB_PATH only takes effect starting the *next* step, not this
          # one — resolve the binary directly here rather than relying on PATH.
          if [ -x "$HOME/.local/bin/actionlint" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            actionlint_bin="$HOME/.local/bin/actionlint"
          else
            actionlint_bin="actionlint"
          fi
          "$actionlint_bin" -version

      - name: Actionlint
        run: actionlint -color .github/workflows/*.yml

  codeql:
    name: CodeQL
    # Keep CodeQL on the labeled self-hosted runner used by the previous
    # GitHub-managed default setup. Its explicit resource cap prevents a scan
    # from consuming every CPU and nearly all RAM on the shared host.
    runs-on: shadow
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # GitHub's default setup used all 32 host threads and 60 GiB RAM.
          # This repository is about 146K LOC, for which GitHub recommends
          # 16 GiB and 4–8 cores on a self-hosted runner.
          threads: 8
          ram: 16384

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
