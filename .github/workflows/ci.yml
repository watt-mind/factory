name: CI

on:
  pull_request:
  push:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shadow-runner-health:
    name: Shadow runner fleet available
    # This check must not use the shadow pool: when that pool is dead, the
    # dedicated light runners are what turn a silent queue into an explicit
    # failing check. Both pools live on the same host.
    runs-on: [self-hosted, smoke-test]
    timeout-minutes: 2
    steps:
      - name: Check shadow runner services
        shell: bash
        run: |
          set -euo pipefail

          active=0
          states=()
          for index in $(seq 1 8); do
            unit="actions.runner.watt-mind.watt-mind-runner-${index}.service"
            state="$(systemctl is-active "$unit" 2>/dev/null || true)"
            states+=("$unit=$state")
            if [ "$state" = "active" ]; then
              active=$((active + 1))
            fi
          done

          printf '%s\n' "${states[@]}"
          if [ "$active" -eq 0 ]; then
            echo "::error::No shadow-labeled runner service is active on this host; Verify would queue indefinitely."
            exit 1
          fi
          if [ "$active" -lt 8 ]; then
            echo "::warning::Shadow runner fleet is degraded: $active/8 services active."
          fi

      - name: Check host temp space and memory
        shell: bash
        run: |
          set -euo pipefail

          # The E2E seed + verify scratch measured 45 MiB after completion on
          # 2026-08-15. A 1 GiB floor leaves more than 22x that measured usage
          # for Actions' own temp files and transient test growth.
          temp_floor_kib=$((1024 * 1024))
          # The full Verify process tree measured a 13.7 GiB peak on this host.
          # Require 16 GiB available before admitting it: 2.3 GiB (17%) of
          # headroom beyond the measured peak.
          memory_floor_kib=$((16 * 1024 * 1024))

          temp_available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          memory_available_kib="$(awk '$1 == "MemAvailable:" { print $2 }' /proc/meminfo)"
          failed=0

          if [ -z "$temp_available_kib" ] || [ "$temp_available_kib" -lt "$temp_floor_kib" ]; then
            echo "::error::Runner temp space below 1 GiB: ${temp_available_kib:-unknown} KiB available at $RUNNER_TEMP."
            failed=1
          else
            echo "Runner temp space: $temp_available_kib KiB available at $RUNNER_TEMP."
          fi

          if [ -z "$memory_available_kib" ] || [ "$memory_available_kib" -lt "$memory_floor_kib" ]; then
            echo "::error::Runner available memory below 16 GiB: ${memory_available_kib:-unknown} KiB MemAvailable."
            failed=1
          else
            echo "Runner available memory: $memory_available_kib KiB MemAvailable."
          fi

          exit "$failed"

  fast-unit-tests:
    name: Fast unit tests
    needs: shadow-runner-health
    # All shadow runners are services on the same physical host. The flock
    # below serializes this job with every integration Verify job across every
    # workflow run without GitHub concurrency's "replace pending run" behavior.
    runs-on: [self-hosted, shadow]
    # Includes time queued on the host-local flock. Keep this comfortably above
    # the measured multi-PR backlog so serialization cannot create false reds.
    timeout-minutes: 45
    steps:
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Setup bun (no action download)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.bun/bin/bun" ] && ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
          fi
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            "$HOME/.bun/bin/bun" --version
          else
            bun --version
          fi

      - name: Acquire host verify lock
        id: verify-lock
        shell: bash
        run: |
          set -euo pipefail
          lock="/tmp/factory-verify-host.lock"
          state_dir="$(mktemp -d "$RUNNER_TEMP/factory-verify-lock.XXXXXX")"
          ready="$state_dir/ready"
          mkfifo "$ready"

          # Keep flock alive across subsequent Actions steps. Reading the FIFO
          # waits on the real lock acquisition rather than sleep-polling. The
          # final always() step and runner cleanup both release the lock.
          (
            flock 9
            printf 'acquired\n' > "$ready"
            exec tail -f /dev/null >/dev/null 2>&1
          ) 9>"$lock" &
          guardian=$!
          read -r _ < "$ready"
          rm -f "$ready"

          echo "guardian=$guardian" >> "$GITHUB_OUTPUT"
          echo "state_dir=$state_dir" >> "$GITHUB_OUTPUT"
          echo "Acquired the shared-host Verify lock on $RUNNER_NAME (guardian $guardian)."

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Test event-runtime library
        # Spawn-heavy suites can exceed Bun's 5s default on the shared host.
        # Explicit liveness bounds declared by individual tests still win.
        run: bun test --timeout 20000 --max-concurrency=4 event-runtime/lib

      - name: Release host verify lock
        if: always() && steps.verify-lock.outputs.guardian != ''
        shell: bash
        env:
          GUARDIAN_PID: ${{ steps.verify-lock.outputs.guardian }}
          LOCK_STATE_DIR: ${{ steps.verify-lock.outputs.state_dir }}
        run: |
          kill "$GUARDIAN_PID" 2>/dev/null || true
          rm -rf "$LOCK_STATE_DIR"

  verify:
    name: Verify
    needs: [shadow-runner-health, fast-unit-tests]
    # Self-hosted per project-conventions PC-03 / PC-22 — cloud runners are
    # forbidden, and shadow is the dedicated host runner label.
    runs-on: [self-hosted, shadow]
    # Includes time queued on the host-local flock. This is a runaway guard,
    # not a performance budget: serialized PR runs must be allowed to wait for
    # the shared host without turning healthy tests red (WM-300, WM-600).
    timeout-minutes: 90
    steps:
      # No `uses:` steps in this job on purpose (WM-573). Every marketplace
      # action is fetched from codeload.github.com at "Set up job", and the
      # shadow fleet (eight runners, one egress IP, no action archive cache)
      # got 429 Too Many Requests on actions/checkout for every Verify job on
      # 2026-08-17 — no repo code ran at all. A plain git fetch of github.sha
      # is exactly what actions/checkout@v7 did here (shallow, no submodules,
      # merge commit on pull_request) minus the download that was failing.
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      # Same reason: oven-sh/setup-bun@v2 is the next codeload download in
      # line, and it also re-fetched bun-linux-x64.zip from GitHub releases on
      # every job. The runner user on the shadow host already has bun under
      # ~/.bun; only install (from bun.sh, not codeload) if it is missing.
      - name: Setup bun (no action download)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.bun/bin/bun" ] && ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
          fi
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            "$HOME/.bun/bin/bun" --version
          else
            bun --version
          fi

      - name: Acquire host verify lock
        id: verify-lock
        shell: bash
        run: |
          set -euo pipefail
          lock="/tmp/factory-verify-host.lock"
          state_dir="$(mktemp -d "$RUNNER_TEMP/factory-verify-lock.XXXXXX")"
          ready="$state_dir/ready"
          mkfifo "$ready"

          # Eight shadow runner services share one physical host. A single flock
          # serializes test jobs across workflow runs so CPU-heavy spawn suites
          # cannot starve one another. FIFO readiness avoids sleep-polling.
          (
            flock 9
            printf 'acquired\n' > "$ready"
            exec tail -f /dev/null >/dev/null 2>&1
          ) 9>"$lock" &
          guardian=$!
          read -r _ < "$ready"
          rm -f "$ready"

          echo "guardian=$guardian" >> "$GITHUB_OUTPUT"
          echo "state_dir=$state_dir" >> "$GITHUB_OUTPUT"
          echo "Acquired the shared-host Verify lock on $RUNNER_NAME (guardian $guardian)."

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      # Web .test.tsx files resolve React's JSX runtime from
      # event-runtime/web/node_modules. Root `bun test` used to run first, so
      # those files died with `Cannot find module 'react/jsx-dev-runtime'`
      # before this install (OPS-384). worktree-up.sh installs web first, which
      # is why local `bun test event-runtime` was a false green.
      - name: Install event-runtime/web deps
        run: cd event-runtime/web && bun install --frozen-lockfile

      - name: Formatting check (prettier)
        run: bun run format:check

      - name: Integration and spawn tests
        # event-runtime/lib runs in the separately rerunnable fast-unit job.
        # Busy shared-host spawn suites exceeded Bun's 5s default on unrelated
        # tests; 20s absorbs host scheduling delay while explicit per-test
        # liveness bounds remain unchanged. Concurrency 4 is the measured
        # non-deadlocking floor from WM-300.
        run: bun test --timeout 20000 --max-concurrency=4 --path-ignore-patterns='event-runtime/lib/**'

      # The sandbox harness must at least be installable and importable
      # (WM-312). Asserts on `sdk`, never on `available`: a self-hosted runner
      # legitimately may not virtualize, and conflating "this host has no QEMU"
      # with "the dependency is missing" is exactly what let the Gondolin SDK
      # sit uninstalled on the live stack for a day while CI stayed green.
      - name: Sandbox harness is installed
        run: |
          bun event-runtime/cli.mjs sandbox doctor || true
          bun event-runtime/cli.mjs sandbox doctor 2>&1 | grep -q "cause *install" \
            && { echo "::error::gondolin SDK is not installed — bun install did not materialize it"; exit 1; }
          echo "sandbox harness present (or unavailable only for host reasons)"

      - name: Generated tree matches shared/
        # The check that stops a rule from living in one harness and nowhere
        # else. If this fails, the fix is to move the rule into shared/ and
        # regenerate — never to edit the generated file.
        run: bun build/emit.mjs --check

      # Agents already typecheck/build the web UI locally; a green Verify on a
      # TSX PR said nothing about compilation until this step existed (OPS-243).
      - name: Typecheck and build event-runtime/web
        run: cd event-runtime/web && bun run build

      - name: Schedule renders match deploy/launchd
        run: bun deploy/gen.mjs && git diff --exit-code deploy/launchd/

      - name: Shell syntax check
        run: |
          for f in bin/*.sh bin/factory; do
            bash -n "$f" || exit 1
          done

      - name: Supervisor lists jobs
        # Cheap smoke test: proves schedule.yaml parses and every job is
        # addressable before anyone tries to run one.
        run: bun orchestrator/run.mjs --list

      - name: Manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/core/.claude-plugin/plugin.json; do
            bun -e "JSON.parse(await Bun.file('$f').text())" || exit 1
          done

      - name: E2E demo runtime seed and verify
        run: |
          set -e
          # Ask the OS for a free loopback port instead of sharing a fixed
          # one with concurrent Verify jobs on this self-hosted host.
          PORT="$(bun -e 'const probe = Bun.serve({ port: 0, fetch: () => new Response("") }); console.log(probe.port); probe.stop(true)')"
          DIR="$(mktemp -d "$RUNNER_TEMP/factory-event-home.XXXXXX")"
          export FACTORY_EVENT_HOME="$DIR"
          export FACTORY_EVENT_PORT="$PORT"

          bun event-runtime/cli.mjs serve --adapter-override fake --port "$PORT" &
          SERVE_PID=$!
          bun event-runtime/cli.mjs work --adapter-override fake &
          WORK_PID=$!

          cleanup() {
            kill -9 $SERVE_PID $WORK_PID 2>/dev/null || true
            rm -rf "$DIR"
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 50); do
            if kill -0 "$SERVE_PID" 2>/dev/null && \
              HEALTH="$(curl -sf "http://127.0.0.1:$PORT/health")" && \
              EXPECTED_HOME="$DIR" HEALTH="$HEALTH" bun -e '
                const health = JSON.parse(process.env.HEALTH);
                if (health.ok !== true || health.env?.home !== process.env.EXPECTED_HOME) process.exit(1);
              '
            then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            echo "demo runtime did not become healthy as serve pid $SERVE_PID with event home $DIR" >&2
            exit 1
          fi

          bun event-runtime/demo/seed.mjs --port "$PORT" --prefix "ci-demo"
          bun event-runtime/demo/verify.mjs --port "$PORT"

      - name: Release host verify lock
        if: always() && steps.verify-lock.outputs.guardian != ''
        shell: bash
        env:
          GUARDIAN_PID: ${{ steps.verify-lock.outputs.guardian }}
          LOCK_STATE_DIR: ${{ steps.verify-lock.outputs.state_dir }}
        run: |
          kill "$GUARDIAN_PID" 2>/dev/null || true
          rm -rf "$LOCK_STATE_DIR"
