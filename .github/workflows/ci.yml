name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: ["develop", "main"]
  schedule:
    - cron: "0 4 * * *" # Nightly continuous exercise of the cloud runner lane (WM-950)
  workflow_dispatch:
    inputs:
      force_hosted:
        description: "Force execution on GitHub-hosted runner (ubuntu-latest)"
        type: boolean
        default: false

permissions:
  contents: read

# One live run per PR, and one per pushed branch: a newer push to develop
# supersedes the older develop run (WM-773 item 6) — a stale develop SHA green
# proves nothing and used to cost a full lane hold per merge.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  route:
    name: Route CI lane
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      self_hosted: ${{ steps.detect.outputs.self_hosted }}
      shadow_labels: ${{ steps.detect.outputs.shadow_labels }}
      verify_labels: ${{ steps.detect.outputs.verify_labels }}
    steps:
      - id: detect
        name: Determine runner lane
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' }}
          IS_BOT: ${{ github.actor == 'dependabot[bot]' }}
          FORCE_HOSTED: ${{ inputs.force_hosted || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ] || [ "$IS_BOT" = "true" ] || [ "$FORCE_HOSTED" = "true" ]; then
            echo "Routing to GitHub-hosted runner (ubuntu-latest)"
            {
              echo "self_hosted=false"
              echo 'shadow_labels=["ubuntu-latest"]'
              echo 'verify_labels=["ubuntu-latest"]'
            } >> "$GITHUB_OUTPUT"
          else
            echo "Routing to self-hosted runner fleet"
            {
              echo "self_hosted=true"
              echo 'shadow_labels=["self-hosted", "shadow"]'
              echo 'verify_labels=["self-hosted", "verify-lane"]'
            } >> "$GITHUB_OUTPUT"
          fi

  shadow-runner-health:
    name: Shadow runner fleet available
    # Gated on self-hosted lane (WM-950). Cloud runners (ubuntu-latest) do not
    # have or require the local shadow fleet.
    needs: route
    if: needs.route.outputs.self_hosted == 'true'
    # This check must not use the shadow pool: when that pool is dead, the
    # dedicated light runners are what turn a silent queue into an explicit
    # failing check. Both pools live on the same host.
    runs-on: [self-hosted, smoke-test]
    timeout-minutes: 2
    steps:
      - name: Check shadow runner services
        shell: bash
        run: |
          set -euo pipefail

          active=0
          states=()
          for index in $(seq 1 8); do
            unit="actions.runner.watt-mind.watt-mind-runner-${index}.service"
            state="$(systemctl is-active "$unit" 2>/dev/null || true)"
            states+=("$unit=$state")
            if [ "$state" = "active" ]; then
              active=$((active + 1))
            fi
          done

          printf '%s\n' "${states[@]}"
          if [ "$active" -eq 0 ]; then
            echo "::error::No shadow-labeled runner service is active on this host; Verify would queue indefinitely."
            exit 1
          fi
          if [ "$active" -lt 8 ]; then
            echo "::warning::Shadow runner fleet is degraded: $active/8 services active."
          fi

      - name: Check host temp space and memory
        shell: bash
        run: |
          set -euo pipefail

          # The E2E seed + verify scratch measured 45 MiB after completion on
          # 2026-08-15. A 1 GiB floor leaves more than 22x that measured usage
          # for Actions' own temp files and transient test growth.
          temp_floor_kib=$((1024 * 1024))
          # The full Verify process tree measured a 13.7 GiB peak on this host.
          # Require 16 GiB available before admitting it: 2.3 GiB (17%) of
          # headroom beyond the measured peak.
          memory_floor_kib=$((16 * 1024 * 1024))

          temp_available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          memory_available_kib="$(awk '$1 == "MemAvailable:" { print $2 }' /proc/meminfo)"
          failed=0

          if [ -z "$temp_available_kib" ] || [ "$temp_available_kib" -lt "$temp_floor_kib" ]; then
            echo "::error::Runner temp space below 1 GiB: ${temp_available_kib:-unknown} KiB available at $RUNNER_TEMP."
            failed=1
          else
            echo "Runner temp space: $temp_available_kib KiB available at $RUNNER_TEMP."
          fi

          if [ -z "$memory_available_kib" ] || [ "$memory_available_kib" -lt "$memory_floor_kib" ]; then
            echo "::error::Runner available memory below 16 GiB: ${memory_available_kib:-unknown} KiB MemAvailable."
            failed=1
          else
            echo "Runner available memory: $memory_available_kib KiB MemAvailable."
          fi

          exit "$failed"

  fast-unit-tests:
    name: Fast unit tests
    # `!cancelled()` overrides GitHub's implicit `success()` gate on `needs`, so
    # this job is still evaluated when `shadow-runner-health` is intentionally
    # skipped on the cloud lane (WM-1122). It stays fail-closed: a cancelled
    # workflow or a failed `route` skips it, and on the self-hosted lane it
    # still requires a healthy shadow fleet.
    if: >-
      ${{
        !cancelled() &&
        needs.route.result == 'success' &&
        (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
        (needs.route.outputs.self_hosted != 'true' || needs.shadow-runner-health.result == 'success')
      }}
    needs: [route, shadow-runner-health]
    # Measurements recorded in docs/ci.md show this bounded suite can run
    # safely without joining the integration/E2E host-lock queue.
    runs-on: ${{ fromJSON(needs.route.outputs.shadow_labels) }}
    timeout-minutes: 15
    steps:
      - name: Sweep stale shared-host temp directories
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          find /tmp -maxdepth 1 -mindepth 1 \( -name 'evrt-*' -o -name 'wm334-real-*' -o -name 'pi-chrome-devtools-*' -o -name 'puppeteer_dev_chrome_profile-*' -o -name 'factory-wt-*' \) -mmin +30 -exec rm -rf {} + || true

      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Setup bun (no action download)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.bun/bin/bun" ] && ! command -v bun >/dev/null 2>&1; then
            version="1.3.14"
            archive="$RUNNER_TEMP/bun-linux-x64.zip"
            extract_dir="$RUNNER_TEMP/bun-linux-x64"
            rm -rf "$extract_dir"
            curl -fsSL -o "$archive" \
              "https://github.com/oven-sh/bun/releases/download/bun-v${version}/bun-linux-x64.zip"
            echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$RUNNER_TEMP"
            install -Dm755 "$extract_dir/bun" "$HOME/.bun/bin/bun"
          fi
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            "$HOME/.bun/bin/bun" --version
          else
            bun --version
          fi

      - name: Measure shared-host load factor
        shell: bash
        run: |
          set -euo pipefail
          cpu_count="$(nproc)"
          runner_jobs="$(pgrep -fc 'Runner\.Worker' || true)"
          read -r _ _ _ runnable _ < /proc/loadavg
          runnable="${runnable%%/*}"
          runner_jobs="${runner_jobs:-1}"
          pressure="$runner_jobs"
          if [ "$runnable" -gt "$pressure" ]; then pressure="$runnable"; fi
          load_factor=$(( (pressure + cpu_count - 1) / cpu_count ))
          if [ "$load_factor" -lt 1 ]; then load_factor=1; fi
          if [ "$load_factor" -gt 4 ]; then load_factor=4; fi
          echo "CI_LOAD_FACTOR=$load_factor" >> "$GITHUB_ENV"
          echo "Spawn-test load factor: $load_factor ($pressure runnable/jobs across $cpu_count CPUs)."

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Initialize local config (factory init)
        # WM-866: config/*.yaml went untracked in WM-794, so this fresh
        # checkout has only the example fallbacks. Individual readers already
        # fall back to config/*.example.yaml on their own, but scaffolding the
        # local files here makes every job behave like a real operator
        # checkout instead of depending on that fallback being wired into
        # every current and future config consumer. `factory init` only
        # writes gitignored config/*.yaml paths and never overwrites, so
        # `git diff --exit-code` proves it stays a no-op against tracked
        # files (and is safe to re-run every job, every time).
        run: |
          bin/factory init
          git diff --exit-code

      - name: Test event-runtime library
        # Spawn-heavy suites can exceed Bun's 5s default on the shared host.
        # Explicit liveness bounds declared by individual tests still win.
        # WM-918: required lane excludes the named timing group; those tests
        # run in the non-required Timing-bound tests job.
        shell: bash
        run: |
          set -euo pipefail
          exclude="$(bun event-runtime/lib/test-helpers-timing.mjs exclude-pattern)"
          set +e
          bun test --timeout 20000 --max-concurrency=4 --test-name-pattern "$exclude" event-runtime/lib | tee "$RUNNER_TEMP/bun-test.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            bun event-runtime/lib/test-helpers-timing.mjs classify "$RUNNER_TEMP/bun-test.log"
          fi
          exit "$status"

      - name: OSS quickstart dry-run
        # WM-799: the 15-minute path must stay green without Linear/GitHub/model
        # credentials. --dry validates the bundled demo repo and prints the plan.
        run: bin/factory demo --dry

      - name: Sweep stale shared-host temp directories
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          find /tmp -maxdepth 1 -mindepth 1 \( -name 'evrt-*' -o -name 'wm334-real-*' -o -name 'pi-chrome-devtools-*' -o -name 'puppeteer_dev_chrome_profile-*' -o -name 'factory-wt-*' \) -mmin +30 -exec rm -rf {} + || true

  timing-bound-tests:
    name: Timing-bound tests
    # WM-918: spawn-and-wait tests whose wall-clock ceilings flake under
    # shared-host contention. Not a required check — required Verify and Fast
    # unit tests exclude this group. A red result here is a flake signal, not
    # a merge blocker.
    # `!cancelled()` overrides GitHub's implicit `success()` gate on `needs`, so
    # this job still reaches a hosted runner when `shadow-runner-health` is
    # intentionally skipped on the cloud lane (WM-1122). Same fail-closed guards
    # as Fast unit tests.
    if: >-
      ${{
        !cancelled() &&
        needs.route.result == 'success' &&
        (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
        (needs.route.outputs.self_hosted != 'true' || needs.shadow-runner-health.result == 'success')
      }}
    needs: [route, shadow-runner-health]
    runs-on: ${{ fromJSON(needs.route.outputs.shadow_labels) }}
    timeout-minutes: 20
    steps:
      - name: Sweep stale shared-host temp directories
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          find /tmp -maxdepth 1 -mindepth 1 \( -name 'evrt-*' -o -name 'wm334-real-*' -o -name 'pi-chrome-devtools-*' -o -name 'puppeteer_dev_chrome_profile-*' -o -name 'factory-wt-*' \) -mmin +30 -exec rm -rf {} + || true

      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Setup bun (no action download)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.bun/bin/bun" ] && ! command -v bun >/dev/null 2>&1; then
            version="1.3.14"
            archive="$RUNNER_TEMP/bun-linux-x64.zip"
            extract_dir="$RUNNER_TEMP/bun-linux-x64"
            rm -rf "$extract_dir"
            curl -fsSL -o "$archive" \
              "https://github.com/oven-sh/bun/releases/download/bun-v${version}/bun-linux-x64.zip"
            echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$RUNNER_TEMP"
            install -Dm755 "$extract_dir/bun" "$HOME/.bun/bin/bun"
          fi
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            "$HOME/.bun/bin/bun" --version
          else
            bun --version
          fi

      - name: Measure shared-host load factor
        shell: bash
        run: |
          set -euo pipefail
          cpu_count="$(nproc)"
          runner_jobs="$(pgrep -fc 'Runner\.Worker' || true)"
          read -r _ _ _ runnable _ < /proc/loadavg
          runnable="${runnable%%/*}"
          runner_jobs="${runner_jobs:-1}"
          pressure="$runner_jobs"
          if [ "$runnable" -gt "$pressure" ]; then pressure="$runnable"; fi
          load_factor=$(( (pressure + cpu_count - 1) / cpu_count ))
          if [ "$load_factor" -lt 1 ]; then load_factor=1; fi
          if [ "$load_factor" -gt 4 ]; then load_factor=4; fi
          echo "CI_LOAD_FACTOR=$load_factor" >> "$GITHUB_ENV"
          echo "Spawn-test load factor: $load_factor ($pressure runnable/jobs across $cpu_count CPUs)."

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      # `bun test --test-name-pattern` still loads every test file before
      # filtering by name, so event-runtime/web/*.test.tsx need their own
      # node_modules here too (same reason as in Full verification, OPS-384);
      # without it the job dies on `Cannot find module '@testing-library/react'`.
      - name: Install event-runtime/web deps
        run: cd event-runtime/web && bun install --frozen-lockfile

      - name: Initialize local config (factory init)
        # WM-866: see the same step in "Fast unit tests" — each job gets its
        # own fresh checkout, so each needs its own scaffold.
        run: |
          bin/factory init
          git diff --exit-code

      - name: Run timing-group tests
        shell: bash
        run: |
          set -euo pipefail
          include="$(bun event-runtime/lib/test-helpers-timing.mjs include-pattern)"
          set +e
          bun test --timeout 30000 --max-concurrency=2 --retry 2 --test-name-pattern "$include" | tee "$RUNNER_TEMP/bun-timing.log"
          status="${PIPESTATUS[0]}"
          set -e
          # bun 1.3.14 reports a zero-match --test-name-pattern as
          # `error: regex "..." matched 0 tests.`, not `Ran 0 tests` — the
          # prior grep here never matched that phrasing and this branch never
          # fired (bun's own exit 1 papered over it). Match both so a stale
          # TIMING_TEST_SUBSTRINGS entry gets the annotation, not just a raw
          # bun error buried in the log (gh-875).
          if grep -qE 'Ran 0 tests|matched 0 tests' "$RUNNER_TEMP/bun-timing.log"; then
            echo "::error::Timing-bound tests job matched 0 tests; TIMING_TEST_SUBSTRINGS is stale."
            exit 1
          fi
          bun event-runtime/lib/test-helpers-timing.mjs classify "$RUNNER_TEMP/bun-timing.log" || true
          exit "$status"

      - name: Sweep stale shared-host temp directories
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          find /tmp -maxdepth 1 -mindepth 1 \( -name 'evrt-*' -o -name 'wm334-real-*' -o -name 'pi-chrome-devtools-*' -o -name 'puppeteer_dev_chrome_profile-*' -o -name 'factory-wt-*' \) -mmin +30 -exec rm -rf {} + || true

  verify:
    name: Full verification
    # `!cancelled()` overrides GitHub's implicit `success()` gate on `needs`, so
    # this job is still evaluated when `shadow-runner-health` is intentionally
    # skipped on the cloud lane (WM-1122). It stays fail-closed: a cancelled
    # workflow or a failed `route` skips it, on the self-hosted lane it still
    # requires a healthy shadow fleet, and it always still requires successful
    # fast unit tests.
    if: >-
      ${{
        !cancelled() &&
        needs.route.result == 'success' &&
        (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
        (needs.route.outputs.self_hosted != 'true' || needs.shadow-runner-health.result == 'success') &&
        needs.fast-unit-tests.result == 'success'
      }}
    needs: [route, shadow-runner-health, fast-unit-tests]
    runs-on: ${{ fromJSON(needs.route.outputs.verify_labels) }}
    # Runaway guard only — queue time is now spent in GitHub's queue, not here.
    timeout-minutes: 45
    steps:
      - name: Sweep stale shared-host temp directories
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          find /tmp -maxdepth 1 -mindepth 1 \( -name 'evrt-*' -o -name 'wm334-real-*' -o -name 'pi-chrome-devtools-*' -o -name 'puppeteer_dev_chrome_profile-*' -o -name 'factory-wt-*' \) -mmin +30 -exec rm -rf {} + || true

      # No `uses:` steps in this job on purpose (WM-573). Every marketplace
      # action is fetched from codeload.github.com at "Set up job", and the
      # shadow fleet (eight runners, one egress IP, no action archive cache)
      # got 429 Too Many Requests on actions/checkout for every Verify job on
      # 2026-08-17 — no repo code ran at all. A plain git fetch of github.sha
      # is exactly what actions/checkout@v7 did here (shallow, no submodules,
      # merge commit on pull_request) minus the download that was failing.
      - name: Checkout (no action download)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* 2>/dev/null || true
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      # Same reason: oven-sh/setup-bun@v2 is the next codeload download in
      # line, and it also re-fetched bun-linux-x64.zip from GitHub releases on
      # every job. The runner user on the shadow host already has bun under
      # ~/.bun; only install (from bun.sh, not codeload) if it is missing.
      - name: Setup bun (no action download)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.bun/bin/bun" ] && ! command -v bun >/dev/null 2>&1; then
            version="1.3.14"
            archive="$RUNNER_TEMP/bun-linux-x64.zip"
            extract_dir="$RUNNER_TEMP/bun-linux-x64"
            rm -rf "$extract_dir"
            curl -fsSL -o "$archive" \
              "https://github.com/oven-sh/bun/releases/download/bun-v${version}/bun-linux-x64.zip"
            echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$RUNNER_TEMP"
            install -Dm755 "$extract_dir/bun" "$HOME/.bun/bin/bun"
          fi
          if [ -x "$HOME/.bun/bin/bun" ]; then
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
            "$HOME/.bun/bin/bun" --version
          else
            bun --version
          fi

      - name: Measure shared-host load factor
        shell: bash
        run: |
          set -euo pipefail
          cpu_count="$(nproc)"
          runner_jobs="$(pgrep -fc 'Runner\.Worker' || true)"
          read -r _ _ _ runnable _ < /proc/loadavg
          runnable="${runnable%%/*}"
          runner_jobs="${runner_jobs:-1}"
          pressure="$runner_jobs"
          if [ "$runnable" -gt "$pressure" ]; then pressure="$runnable"; fi
          load_factor=$(( (pressure + cpu_count - 1) / cpu_count ))
          if [ "$load_factor" -lt 1 ]; then load_factor=1; fi
          if [ "$load_factor" -gt 4 ]; then load_factor=4; fi
          echo "CI_LOAD_FACTOR=$load_factor" >> "$GITHUB_ENV"
          echo "Spawn-test load factor: $load_factor ($pressure runnable/jobs across $cpu_count CPUs)."

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      # Web .test.tsx files resolve React's JSX runtime from
      # event-runtime/web/node_modules. Root `bun test` used to run first, so
      # those files died with `Cannot find module 'react/jsx-dev-runtime'`
      # before this install (OPS-384). worktree-up.sh installs web first, which
      # is why local `bun test event-runtime` was a false green.
      - name: Install event-runtime/web deps
        run: cd event-runtime/web && bun install --frozen-lockfile

      - name: Initialize local config (factory init)
        # WM-866: see the same step in "Fast unit tests" — each job gets its
        # own fresh checkout, so each needs its own scaffold. Full
        # verification also runs orchestrator/deploy commands (Supervisor
        # lists jobs, Schedule renders match deploy/launchd) that read
        # config/*.yaml, so this job needs the scaffold in place before those
        # steps too.
        run: |
          bin/factory init
          git diff --exit-code

      # WM-607: root JS + event-runtime/web TSX now lint via eslint.config.mjs.
      # --max-warnings pins the current warning count so it can only shrink;
      # if this fails on a warning-count bump, burn down warnings or bump the
      # number deliberately in the same PR, never drop the flag.
      - name: Lint (eslint)
        run: bun run lint --max-warnings=627

      # Run tsc + Vite before tests so broken TSX imports and entry-chunk budget
      # regressions fail Verify immediately instead of reaching a later build.
      - name: Typecheck and build event-runtime/web
        run: cd event-runtime/web && bun run build

      - name: Formatting check (prettier)
        run: bun run format:check

      # WM-1122: the shadow/verify self-hosted image ships ripgrep, but the
      # GitHub-hosted ubuntu-latest cloud lane (nightly/fork/force_hosted) does
      # not. Without it the guard below hits `rg: command not found` and
      # misreports it as a stale search contract, failing Verify on every
      # cloud-lane run. Install it only when missing so the self-hosted lane is
      # untouched.
      - name: Ensure ripgrep is available
        if: runner.environment != 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ripgrep
          fi
          rg --version | head -1

      - name: Guard host-serialized spawn suites
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t spawn_suites < <(
            rg -l --glob '*.test.mjs' \
              "from [\"']node:child_process[\"']|Bun\\.spawn|spawnTracked|spawnWorker|spawnSupervisor|assertHealthyLiveServe|runNotifierDeliveryCase" \
              event-runtime/cli event-runtime/demo event-runtime/lib/adapters \
              | sort
          )

          if [ "${#spawn_suites[@]}" -eq 0 ]; then
            echo "::error::Spawn-suite guard found no tests; its search contract is stale."
            exit 1
          fi

          unexpected=()
          for suite in "${spawn_suites[@]}"; do
            if [[ "$suite" =~ ^event-runtime/cli/[^/]+\.test\.mjs$ ]]; then
              route="Verify / Integration and spawn tests"
            elif [[ "$suite" = "event-runtime/demo/seed.test.mjs" ]]; then
              route="Verify / Integration and spawn tests"
            elif [[ "$suite" =~ ^event-runtime/lib/adapters/[^/]+\.test\.mjs$ ]]; then
              route="Fast unit tests / Test event-runtime library"
            else
              unexpected+=("$suite")
              continue
            fi
            printf '%s -> %s (lane/fast-unit)\n' "$suite" "$route"
          done

          if [ "${#unexpected[@]}" -gt 0 ]; then
            printf '::error::Runtime-spawning test suite is outside a host-locked route: %s\n' "${unexpected[*]}"
            exit 1
          fi

      - name: Integration and spawn tests
        # event-runtime/lib runs in the separately rerunnable fast-unit job.
        # Busy shared-host spawn suites exceeded Bun's 5s default on unrelated
        # tests; 20s absorbs host scheduling delay while explicit per-test
        # liveness bounds remain unchanged. Concurrency 4 is the measured
        # non-deadlocking floor from WM-300.
        # WM-918: required lane excludes the named timing group.
        shell: bash
        run: |
          set -euo pipefail
          exclude="$(bun event-runtime/lib/test-helpers-timing.mjs exclude-pattern)"
          set +e
          bun test --timeout 20000 --max-concurrency=4 --path-ignore-patterns='event-runtime/lib/**' --test-name-pattern "$exclude" | tee "$RUNNER_TEMP/bun-test.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            bun event-runtime/lib/test-helpers-timing.mjs classify "$RUNNER_TEMP/bun-test.log"
          fi
          exit "$status"

      # The sandbox harness must at least be installable and importable
      # (WM-312). Asserts on `sdk`, never on `available`: a self-hosted runner
      # legitimately may not virtualize, and conflating "this host has no QEMU"
      # with "the dependency is missing" is exactly what let the Gondolin SDK
      # sit uninstalled on the live stack for a day while CI stayed green.
      - name: Sandbox harness is installed
        run: |
          bun event-runtime/cli.mjs sandbox doctor || true
          bun event-runtime/cli.mjs sandbox doctor 2>&1 | grep -q "cause *install" \
            && { echo "::error::gondolin SDK is not installed — bun install did not materialize it"; exit 1; }
          echo "sandbox harness present (or unavailable only for host reasons)"

      - name: Generated tree matches shared/
        # The check that stops a rule from living in one harness and nowhere
        # else. If this fails, the fix is to move the rule into shared/ and
        # regenerate — never to edit the generated file.
        run: bun build/emit.mjs --check

      - name: OSS quickstart dry-run
        run: bin/factory demo --dry

      - name: Schedule renders match deploy/launchd
        run: bun deploy/gen.mjs && git diff --exit-code deploy/launchd/

      - name: Shell syntax check
        run: |
          for f in bin/*.sh bin/factory demo/repo/bin/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Supervisor lists jobs
        # Cheap smoke test: proves schedule.yaml parses and every job is
        # addressable before anyone tries to run one.
        run: bun orchestrator/run.mjs --list

      - name: Manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/core/.claude-plugin/plugin.json; do
            bun -e "JSON.parse(await Bun.file('$f').text())" || exit 1
          done

      - name: E2E demo runtime seed and verify
        run: |
          set -e
          # Ask the OS for a free loopback port instead of sharing a fixed
          # one with concurrent Verify jobs on this self-hosted host.
          PORT="$(bun -e 'const probe = Bun.serve({ port: 0, fetch: () => new Response("") }); console.log(probe.port); probe.stop(true)')"
          DIR="$(mktemp -d "$RUNNER_TEMP/factory-event-home.XXXXXX")"
          export FACTORY_EVENT_HOME="$DIR"
          export FACTORY_EVENT_PORT="$PORT"

          bun event-runtime/cli.mjs serve --adapter-override fake --port "$PORT" &
          SERVE_PID=$!
          bun event-runtime/cli.mjs work --adapter-override fake &
          WORK_PID=$!

          cleanup() {
            kill -9 $SERVE_PID $WORK_PID 2>/dev/null || true
            rm -rf "$DIR"
          }
          trap cleanup EXIT

          ready=0
          # shellcheck disable=SC2034 # bounded retry counter; loop body doesn't need the index
          for i in $(seq 50); do
            if kill -0 "$SERVE_PID" 2>/dev/null && \
              HEALTH="$(curl -sf "http://127.0.0.1:$PORT/health")" && \
              EXPECTED_HOME="$DIR" HEALTH="$HEALTH" bun -e '
                const health = JSON.parse(process.env.HEALTH);
                if (health.ok !== true || health.env?.home !== process.env.EXPECTED_HOME) process.exit(1);
              '
            then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            echo "demo runtime did not become healthy as serve pid $SERVE_PID with event home $DIR" >&2
            exit 1
          fi

          bun event-runtime/demo/seed.mjs --port "$PORT" --prefix "ci-demo"
          bun event-runtime/demo/verify.mjs --port "$PORT"

      - name: Sweep stale shared-host temp directories
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          find /tmp -maxdepth 1 -mindepth 1 \( -name 'evrt-*' -o -name 'wm334-real-*' -o -name 'pi-chrome-devtools-*' -o -name 'puppeteer_dev_chrome_profile-*' -o -name 'factory-wt-*' \) -mmin +30 -exec rm -rf {} + || true

  required-verify:
    name: Verify
    if: always()
    needs: [route, shadow-runner-health, fast-unit-tests, verify]
    # Runs on cloud runner so required verification is decoupled from host fleet
    # health when executing cloud PR runs (WM-950).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
      SELF_HOSTED: ${{ needs.route.outputs.self_hosted }}
      HEALTH_RESULT: ${{ needs.shadow-runner-health.result }}
      FAST_RESULT: ${{ needs.fast-unit-tests.result }}
      FULL_RESULT: ${{ needs.verify.result }}
    steps:
      - name: Report required verification result
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_DRAFT" = "true" ]; then
            echo "Draft pull request: expensive test jobs intentionally skipped."
            exit 0
          fi

          failed=0
          if [ "$SELF_HOSTED" = "true" ]; then
            echo "Shadow runner fleet available=$HEALTH_RESULT"
            if [ "$HEALTH_RESULT" != "success" ]; then
              failed=1
            fi
          else
            echo "Cloud runner lane active: shadow runner fleet health check skipped."
          fi

          for result in \
            "Fast unit tests=$FAST_RESULT" \
            "Full verification=$FULL_RESULT"
          do
            echo "$result"
            if [ "${result##*=}" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more required verification jobs did not succeed."
          fi
          exit "$failed"
