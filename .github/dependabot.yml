version: 2
updates:
  # Maintain dependencies for npm / bun package ecosystem (root)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Keep routine dependency maintenance reviewable; security updates are
    # unaffected because this ignore rule applies only to version updates.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"

  # Maintain dependencies for event-runtime/web
  - package-ecosystem: "npm"
    directory: "/event-runtime/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Keep routine dependency maintenance reviewable; security updates are
    # unaffected because this ignore rule applies only to version updates.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"

  # Maintain updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"
