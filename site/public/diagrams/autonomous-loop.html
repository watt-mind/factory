<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The autonomous software loop</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      /* Hallmark · genre: modern-minimal · macrostructure: Polar Loop · design-system: Watt Mind · designed-as-app */
      /* Hallmark · pre-emit critique: P5 H4 E5 S5 R5 V5 */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
        --paper: oklch(98% 0.004 178);
        --ink: oklch(18.77% 0.01139 175.67);
        --muted: oklch(39.325% 0.01702 185.19);
        --soft: oklch(55% 0.018 178);
        --accent: oklch(57% 0.11 182.52);
        --accent-tint: oklch(92% 0.04 182.52);
        --rule: oklch(39.325% 0.01702 185.19 / 0.18);
        --display: "Plus Jakarta Sans", system-ui, sans-serif;
        --sans: "Inter", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: oklch(18.77% 0.01139 175.67);
          --ink: oklch(91.268% 0.00852 168.74);
          --muted: oklch(82.637% 0.01726 178.17);
          --soft: oklch(65.329% 0.01821 177.96);
          --accent: oklch(81.137% 0.12259 182.52);
          --accent-tint: oklch(70.375% 0.12302 182.5 / 0.13);
          --rule: oklch(39.325% 0.01702 185.19 / 0.72);
        }
      }

      :root[data-theme="dark"] {
        --paper: oklch(18.77% 0.01139 175.67);
        --ink: oklch(91.268% 0.00852 168.74);
        --muted: oklch(82.637% 0.01726 178.17);
        --soft: oklch(65.329% 0.01821 177.96);
        --accent: oklch(81.137% 0.12259 182.52);
        --accent-tint: oklch(70.375% 0.12302 182.5 / 0.13);
        --rule: oklch(39.325% 0.01702 185.19 / 0.72);
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 40px;
        background-color: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }

      .frame {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font: 500 8px var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        color: var(--ink);
        font: 700 28px/1.12 var(--display);
        letter-spacing: -0.035em;
      }

      svg {
        display: block;
        width: 100%;
        height: calc(100vh - 112px);
      }

      .ring {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.2;
      }

      .spoke {
        fill: none;
        stroke: var(--soft);
        stroke-width: 1;
        stroke-dasharray: 5 4;
      }

      .station {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 1;
      }

      .station.focal {
        fill: var(--accent-tint);
        stroke: var(--accent);
        stroke-width: 1.2;
      }

      .hub {
        fill: var(--ink);
      }

      .node-name {
        fill: var(--ink);
        font: 600 14px var(--sans);
        text-anchor: middle;
      }

      .focal-name {
        fill: var(--accent);
      }

      .sublabel {
        fill: var(--soft);
        font: 400 9px var(--mono);
        text-anchor: middle;
      }

      .hub-name {
        fill: var(--paper);
        font: 600 16px var(--sans);
        text-anchor: middle;
      }

      .hub-sub {
        fill: var(--paper);
        font: 400 9px var(--mono);
        text-anchor: middle;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <p class="eyebrow">Operating loop · Factory</p>
      <h1>Every completed ticket improves the next run</h1>
      <svg
        viewBox="0 0 1040 680"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="autonomous-loop-title autonomous-loop-desc"
      >
        <title id="autonomous-loop-title">The autonomous software loop</title>
        <desc id="autonomous-loop-desc">
          Six stages move clockwise from triage through learning and back to
          triage. Each stage writes durable evidence to the central control
          plane and git record, with independent verification highlighted.
        </desc>
        <defs>
          <marker
            id="arrow"
            markerWidth="8"
            markerHeight="6"
            refX="7"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 8 3, 0 6" fill="context-stroke" />
          </marker>
          <marker
            id="arrow-accent"
            markerWidth="8"
            markerHeight="6"
            refX="7"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 8 3, 0 6" fill="context-stroke" />
          </marker>
          <marker
            id="arrow-link"
            markerWidth="8"
            markerHeight="6"
            refX="7"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 8 3, 0 6" fill="context-stroke" />
          </marker>
          <marker
            id="arrow-soft"
            markerWidth="8"
            markerHeight="6"
            refX="7"
            refY="3"
            orient="auto"
          >
            <polygon points="0 0, 8 3, 0 6" fill="context-stroke" />
          </marker>
        </defs>
        <rect width="1040" height="680" fill="transparent" />

        <path
          class="ring"
          d="M600 113.726 A240 240 0 0 1 704.969 187.073"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M743.285 252 A240 240 0 0 1 743.722 426.882"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M705.731 492 A240 240 0 0 1 601.130 565.871"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M440 566.274 A240 240 0 0 1 335.031 492.927"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M296.715 428 A240 240 0 0 1 296.278 253.118"
          marker-end="url(#arrow)"
        />
        <path
          class="ring"
          d="M334.269 188 A240 240 0 0 1 438.870 114.129"
          marker-end="url(#arrow)"
        />

        <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)" />
        <path
          class="spoke"
          d="M672 252 L616 284"
          marker-end="url(#arrow-soft)"
        />
        <path
          class="spoke"
          d="M672 428 L616 396"
          marker-end="url(#arrow-soft)"
        />
        <path class="spoke" d="M520 548 V400" marker-end="url(#arrow-soft)" />
        <path
          class="spoke"
          d="M368 428 L424 396"
          marker-end="url(#arrow-soft)"
        />
        <path
          class="spoke"
          d="M368 252 L424 284"
          marker-end="url(#arrow-soft)"
        />

        <rect class="station" x="440" y="68" width="160" height="64" rx="6" />
        <text x="520" y="96" class="node-name">Triage</text>
        <text x="520" y="116" class="sublabel">make work falsifiable</text>

        <rect class="station" x="648" y="188" width="160" height="64" rx="6" />
        <text x="728" y="216" class="node-name">Claim &amp; isolate</text>
        <text x="728" y="236" class="sublabel">one ticket / worktree</text>

        <rect class="station" x="648" y="428" width="160" height="64" rx="6" />
        <text x="728" y="456" class="node-name">Implement</text>
        <text x="728" y="476" class="sublabel">bounded agent process</text>

        <rect
          class="station focal"
          x="440"
          y="548"
          width="160"
          height="64"
          rx="6"
        />
        <text x="520" y="576" class="node-name focal-name">Verify</text>
        <text x="520" y="596" class="sublabel">independent evidence</text>

        <rect class="station" x="232" y="428" width="160" height="64" rx="6" />
        <text x="312" y="456" class="node-name">Review &amp; merge</text>
        <text x="312" y="476" class="sublabel">CI + diff gate</text>

        <rect class="station" x="232" y="188" width="160" height="64" rx="6" />
        <text x="312" y="216" class="node-name">Learn &amp; refill</text>
        <text x="312" y="236" class="sublabel">friction becomes intake</text>

        <rect class="hub" x="420" y="288" width="200" height="104" rx="8" />
        <text x="520" y="336" class="hub-name">Durable record</text>
        <text x="520" y="360" class="hub-sub">tracker · git · CI receipts</text>
      </svg>
    </main>
  </body>
</html>
