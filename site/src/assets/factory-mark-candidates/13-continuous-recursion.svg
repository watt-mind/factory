    fill="none"
    stroke="#dde4e1"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 352 330 H 416"
    fill="none"
    stroke="#4fdbc8"
    stroke-width="16"
    stroke-linecap="butt"
  />
</svg>
