<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 420"
  role="img"
  aria-labelledby="continuous-recursion-title continuous-recursion-desc"
>
  <title id="continuous-recursion-title">
    Factory continuous recursion mark
  </title>
  <desc id="continuous-recursion-desc">
    A single path forms a small chamfered envelope that unfolds into a larger
    copy of itself; the final run passes through a short teal gate at the outer
    boundary and continues out of the figure.
  </desc>
  <path
