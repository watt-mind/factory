<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 420"
  role="img"
  aria-labelledby="chamfered-recursion-title chamfered-recursion-desc"
>
  <title id="chamfered-recursion-title">Factory chamfered recursion mark</title>
  <desc id="chamfered-recursion-desc">
    An open square envelope with a chamfered lower-left corner contains a
    half-scale copy of itself; the inner envelope's exit run meets a short teal
    gate in the outer boundary, below which the outer run leaves the figure.
  </desc>
